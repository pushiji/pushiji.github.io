<script>
(function () {
  'use strict';

  const THEMES = {
    kiln: {
      name:'窑', dot:'#ff9a3c',
      bg:'radial-gradient(ellipse at 50% 48%, #1a0a02 0%, #0a0401 55%, #030100 100%)',
      hue0:18, hue1:48, sat0:82, sat1:100, light0:44, light1:70,
      accent:34, starHue:[20,45]
    },
    ember: {
      name:'烬', dot:'#ff5c3a',
      bg:'radial-gradient(ellipse at 50% 48%, #1c0503 0%, #0b0201 55%, #030000 100%)',
      hue0:2, hue1:36, sat0:88, sat1:100, light0:42, light1:70,
      accent:16, starHue:[2,35]
    },
    gold: {
      name:'鎏', dot:'#ffd766',
      bg:'radial-gradient(ellipse at 50% 48%, #1c1402 0%, #0b0701 55%, #030200 100%)',
      hue0:38, hue1:58, sat0:78, sat1:98, light0:46, light1:72,
      accent:48, starHue:[36,58]
    },
    dusk: {
      name:'暮', dot:'#ff7a4a',
      bg:'radial-gradient(ellipse at 50% 48%, #1a0806 0%, #0a0302 55%, #030100 100%)',
      hue0:8, hue1:42, sat0:84, sat1:100, light0:44, light1:72,
      accent:26, starHue:[6,42]
    }
  };

  const BY = 1985, BM = 0, BD = 26;
  const birthUTC = Date.UTC(BY, BM, BD);
  const now = new Date();
  const nowUTC  = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  const daysLived = Math.floor((nowUTC - birthUTC) / 86400000);

  let ageNow = now.getFullYear() - BY;
  const thisBday = new Date(now.getFullYear(), BM, BD);
  if (now < thisBday) ageNow--;

  const N = ageNow + 1;
  const START_YEAR = BY;
  const lastBday = now >= thisBday ? thisBday : new Date(now.getFullYear() - 1, BM, BD);
  const nextBday = new Date(lastBday.getFullYear() + 1, BM, BD);
  const growth = Math.min(1, Math.max(0.08, (now - lastBday) / (nextBday - lastBday)));

  const rawW = [];
  for (let i = 0; i < N; i++) {
    const y = START_YEAR + i;
    const w = 1
      + 0.30 * Math.sin(y * 1.37)
      + 0.22 * Math.cos(y * 0.73)
      + 0.14 * Math.sin(y * 2.11 + 1.2);
    rawW.push(Math.max(0.55, w));
  }
  rawW[N - 1] *= growth;
  const totalW = rawW.reduce((a, b) => a + b, 0);

  const stage   = document.getElementById('stage');
  const cv      = document.getElementById('cv');
  const ctx     = cv.getContext('2d');
  const meta    = document.querySelector('.meta');
  const daysNum = document.getElementById('daysNum');
  const plabel  = document.getElementById('plabel');
  const plYr    = document.getElementById('plYr');
  const plDt    = document.getElementById('plDt');
  const themesEl= document.getElementById('themes');
  const stageWrap = document.getElementById('stage-wrap');

  daysNum.textContent = daysLived.toLocaleString('en-US');

  let TH = THEMES.kiln;
  let W = 0, H = 0, DPR = 1;
  let cx = 0, cy = 0;
  let innerR = 12, maxR = 300;
  let radii = [];
  let off = null;
  let wx = 0, wy = 0, twx = 0, twy = 0;
  let mx = -999, my = -999;
  let hoverIdx = -1, prevHoverIdx = -1;
  let labelDirty = true;
  let touchMode = false;
  let stars = [];
  const flows = [], bursts = [], pulses = [], motes = [];
  let lastPulse = 0;
  const T0 = performance.now();
  let prevT = T0;

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

  function hueAt(t) {
    const d = TH.hue1 - TH.hue0;
    return ((TH.hue0 + d * t) % 360 + 360) % 360;
  }
  function randHue(range) {
    let d = range[1] - range[0];
    if (d < 0) d += 360;
    return ((range[0] + Math.random() * d) % 360 + 360) % 360;
  }
  function noiseAt(a, r) {
    const amp = 0.55 + r * 0.0045;
    return amp * (
      0.50 * Math.sin(a * 3  + r * 0.045) +
      0.30 * Math.sin(a * 5  - r * 0.031) +
      0.20 * Math.sin(a * 8  + r * 0.017) +
      0.10 * Math.sin(a * 13 + r * 0.009)
    );
  }
  function circlePoints(radius, steps) {
    const pts = [];
    for (let s = 0; s < steps; s++) {
      const a = (s / steps) * Math.PI * 2;
      const rr = radius + noiseAt(a, radius);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    return pts;
  }
  function tracePts(c, pts, close) {
    c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    if (close) c.closePath();
  }
  function ringPath(c, rIn, rOut, steps) {
    const outer = circlePoints(rOut, steps);
    const inner = circlePoints(rIn, steps).reverse();
    c.beginPath();
    tracePts(c, outer, false);
    for (let i = 0; i < inner.length; i++) c.lineTo(inner[i][0], inner[i][1]);
    c.closePath();
  }
  function strokeCircle(c, r, steps) {
    c.beginPath();
    tracePts(c, circlePoints(r, steps), true);
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 0.95 + 0.14,
        base: Math.random() * 0.38 + 0.08,
        sp: 0.4 + Math.random() * 2.2,
        ph: Math.random() * Math.PI * 2,
        hue: randHue(TH.starHue)
      });
    }
  }
  function initFlows() {
    flows.length = 0;
    const denom = (N - 1) || 1;
    for (let i = 1; i < N - 1; i++) {
      const cnt = 1 + Math.floor(Math.random() * 2);
      const hue = hueAt(i / denom);
      for (let j = 0; j < cnt; j++) {
        flows.push({
          ring: i,
          a: Math.random() * Math.PI * 2,
          sp: (0.45 + Math.random() * 0.95) * (Math.random() < 0.5 ? -1 : 1),
          size: 0.9 + Math.random() * 1.3,
          hue: hue + (Math.random() - 0.5) * 16,
          tail: 7 + Math.floor(Math.random() * 6)
        });
      }
    }
  }
  function initMotes() {
    motes.length = 0;
    for (let i = 0; i < 60; i++) {
      motes.push({
        x: Math.random() * 2 - 1,
        y: Math.random() * 2 - 1,
        vx: (Math.random() - 0.5) * 0.0004,
        vy: -0.0004 - Math.random() * 0.0009,
        size: 0.5 + Math.random() * 1.6,
        life: Math.random(),
        decay: 0.0006 + Math.random() * 0.0016,
        hue: randHue(TH.starHue),
        ph: Math.random() * Math.PI * 2
      });
    }
  }

  function applyTheme(key) {
    TH = THEMES[key];
    stageWrap.style.background = TH.bg;
    meta.style.color = `hsla(${TH.hue0 + 4},42%,82%,.98)`;
    Array.prototype.forEach.call(themesEl.children, function (b) {
      b.classList.toggle('on', b.dataset.k === key);
    });
    initStars(); initFlows(); initMotes();
    if (W > 10) buildOffscreen();
  }

  Object.keys(THEMES).forEach(function (k) {
    const b = document.createElement('button');
    b.dataset.k = k;
    b.title = THEMES[k].name;
    b.setAttribute('aria-label', THEMES[k].name);
    b.style.setProperty('--c', THEMES[k].dot);
    b.addEventListener('click', function () { applyTheme(k); });
    themesEl.appendChild(b);
  });

  /* ============ 强制正方形 + 移动端圆盘微调 ============ */
  function layout() {
    const wrapRect = stageWrap.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // 可用宽度取容器宽度与视口宽度的较小值（防止主题给容器加内边距撑宽）
    const availW = Math.max(200, Math.min(wrapRect.width || vw, vw));
    // 可用高度取视口高度，正方形最多占 86%，剩下给上下留白
    const availH = Math.max(200, vh);

    const size = Math.floor(Math.min(availW * 0.98, availH * 0.86));
    if (size < 80) return;

    // 关键：inline style + !important，任何主题都覆盖不掉
    stage.style.setProperty('width',     size + 'px', 'important');
    stage.style.setProperty('height',    size + 'px', 'important');
    stage.style.setProperty('max-width', size + 'px', 'important');
    stage.style.setProperty('max-height',size + 'px', 'important');
    stage.style.setProperty('aspect-ratio','auto',    'important');

    W = size; H = size;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    cv.width  = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.setProperty('width',  W + 'px', 'important');
    cv.style.setProperty('height', H + 'px', 'important');

    const isNarrow = size < 480;

    // 窄屏：圆盘略缩、中心略上移，给底部文字留干净空间
    // 宽屏：完全保持原版参数
    if (isNarrow) {
      cx = W / 2;
      cy = H * 0.435;
      maxR = Math.min(W, H) * 0.40;
    } else {
      cx = W / 2;
      cy = H / 2 - H * 0.028;
      maxR = Math.min(W, H) * 0.46;
    }
    innerR = Math.max(10, maxR * 0.045);

    const k = (maxR - innerR) / totalW;
    radii = [innerR];
    let r = innerR;
    for (let i = 0; i < N; i++) { r += rawW[i] * k; radii.push(r); }

    buildOffscreen();
    labelDirty = true;
  }

  function buildOffscreen() {
    off = document.createElement('canvas');
    off.width  = Math.round(W * DPR);
    off.height = Math.round(H * DPR);
    const c = off.getContext('2d');
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    c.save();
    c.translate(cx, cy);

    const denom = (N - 1) || 1;

    const outerGlow = c.createRadialGradient(0, 0, maxR * 0.55, 0, 0, maxR * 1.18);
    outerGlow.addColorStop(0,    `hsla(${TH.hue1},100%,60%,0)`);
    outerGlow.addColorStop(0.65, `hsla(${TH.hue1},100%,58%,0.06)`);
    outerGlow.addColorStop(1,    `hsla(${TH.hue1},100%,55%,0)`);
    c.fillStyle = outerGlow;
    c.beginPath(); c.arc(0, 0, maxR * 1.18, 0, Math.PI * 2); c.fill();

    for (let i = 0; i < N; i++) {
      const rIn  = radii[i];
      const rOut = radii[i + 1];
      const t = i / denom;
      const hue   = hueAt(t);
      const sat   = TH.sat0 + (TH.sat1 - TH.sat0) * t;
      const light = TH.light0 + (TH.light1 - TH.light0) * t;
      const yr = START_YEAR + i;
      const isKey = (yr % 10 === 0) || i === 0 || i === N - 1;

      ringPath(c, rIn, rOut, 190);
      c.fillStyle = `hsla(${hue},${sat * 0.6}%,${Math.max(2, light - 42)}%,0.82)`;
      c.fill();

      const fillGrad = c.createRadialGradient(0, 0, rIn, 0, 0, rOut);
      fillGrad.addColorStop(0,   `hsla(${hue},${sat}%,${light}%,0.05)`);
      fillGrad.addColorStop(0.5, `hsla(${hue},${sat}%,${light}%,0.16)`);
      fillGrad.addColorStop(1,   `hsla(${hue},${sat}%,${light}%,0.42)`);
      ringPath(c, rIn, rOut, 190);
      c.fillStyle = fillGrad;
      c.fill();

      strokeCircle(c, rIn, 190);
      c.strokeStyle = `hsla(${hue - 8},${sat}%,${Math.max(10, light - 22)}%,0.42)`;
      c.lineWidth = 0.7;
      c.stroke();

      strokeCircle(c, rOut, 190);
      c.save();
      c.shadowColor = `hsla(${hue},100%,${light}%,${isKey ? 1 : 0.9})`;
      c.shadowBlur  = isKey ? 30 : 15;
      c.strokeStyle = `hsla(${hue},100%,${Math.min(96, light + 22)}%,${isKey ? 1 : 0.88})`;
      c.lineWidth   = isKey ? 2.0 : 1.1;
      c.stroke();
      c.restore();

      if (isKey) {
        strokeCircle(c, rOut + 1.7, 190);
        c.save();
        c.shadowColor = `hsla(${hue},100%,72%,0.95)`;
        c.shadowBlur  = 22;
        c.strokeStyle = `hsla(${hue},100%,88%,0.60)`;
        c.lineWidth   = 0.75;
        c.stroke();
        c.restore();
      }

      if (i % 2 === 0 && (rOut - rIn) > 4) {
        const nL = 10, phase = i * 0.53;
        c.save();
        c.globalAlpha = 0.18;
        c.strokeStyle = `hsla(${hue},100%,${light + 15}%,1)`;
        c.lineWidth = 0.5;
        for (let k2 = 0; k2 < nL; k2++) {
          const a = (k2 / nL) * Math.PI * 2 + phase;
          const rr1 = rIn + 1.2, rr2 = rOut - 1.2;
          if (rr2 <= rr1) continue;
          c.beginPath();
          c.moveTo(Math.cos(a) * rr1, Math.sin(a) * rr1);
          c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2);
          c.stroke();
        }
        c.restore();
      }
    }

    const coreR = innerR * 0.74;
    const coreGrad = c.createRadialGradient(0, 0, 0, 0, 0, coreR * 3.4);
    coreGrad.addColorStop(0,    'rgba(255,252,240,0.98)');
    coreGrad.addColorStop(0.22, `hsla(${TH.accent},100%,76%,0.55)`);
    coreGrad.addColorStop(0.55, `hsla(${TH.accent},100%,60%,0.18)`);
    coreGrad.addColorStop(1,    'rgba(0,0,0,0)');
    c.fillStyle = coreGrad;
    c.beginPath(); c.arc(0, 0, coreR * 3.4, 0, Math.PI * 2); c.fill();

    c.restore();
  }

  function drawSpace(time) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 3; i++) {
      const phase = time * (0.045 + i * 0.022) + i * 2.3;
      const ax = cx + Math.cos(phase) * W * 0.24;
      const ay = cy + Math.sin(phase * 0.76 + i) * H * 0.24;
      const ar = W * 0.52;
      const hue = TH.hue0 + (i * 8);
      const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, ar);
      g.addColorStop(0,   `hsla(${hue},88%,52%,0.10)`);
      g.addColorStop(0.5, `hsla(${hue},88%,46%,0.045)`);
      g.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.4 + 0.6 * Math.abs(Math.sin(time * s.sp + s.ph));
      ctx.beginPath();
      ctx.arc(s.x * W - wx * 0.32, s.y * H - wy * 0.32, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${s.hue},95%,82%,${s.base * tw})`;
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMotes(time, px, py, dt) {
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      m.life -= m.decay * (dt / 16);
      m.x += m.vx * (dt / 16) * 60;
      m.y += m.vy * (dt / 16) * 60;
      if (m.life <= 0 || m.y < -maxR * 1.1) {
        m.x = (Math.random() * 2 - 1) * maxR * 0.9;
        m.y = maxR * 0.95 + Math.random() * 30;
        m.vx = (Math.random() - 0.5) * 0.0004;
        m.vy = -0.0004 - Math.random() * 0.0009;
        m.size = 0.5 + Math.random() * 1.6;
        m.life = 1;
        m.hue = randHue(TH.starHue);
        continue;
      }
      const tw = 0.5 + 0.5 * Math.sin(time * 2.4 + m.ph);
      const alpha = m.life * tw * 0.7;
      const x = m.x * maxR, y = m.y * maxR;
      ctx.beginPath(); ctx.arc(x, y, m.size * 2.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${m.hue},100%,70%,${alpha * 0.10})`; ctx.fill();
      ctx.beginPath(); ctx.arc(x, y, m.size * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${m.hue},100%,88%,${alpha})`;
      ctx.shadowColor = `hsla(${m.hue},100%,68%,${alpha})`;
      ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function drawFlows(time, px, py) {
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (let i = 0; i < flows.length; i++) {
      const f = flows[i];
      f.a += f.sp * 0.014;
      const rMid = (radii[f.ring] + radii[f.ring + 1]) / 2;
      for (let t = f.tail - 1; t >= 0; t--) {
        const ta = f.a - t * 0.038 * Math.sign(f.sp) * Math.abs(f.sp);
        const tr = rMid + noiseAt(ta, rMid);
        const tx = Math.cos(ta) * tr, ty = Math.sin(ta) * tr;
        const k = 1 - t / f.tail;
        const alpha = k * k * 0.92;
        ctx.beginPath(); ctx.arc(tx, ty, f.size * k * 1.15, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${f.hue},100%,${72 + k * 22}%,${alpha})`;
        ctx.fill();
      }
      const ra = rMid + noiseAt(f.a, rMid);
      const hx = Math.cos(f.a) * ra, hy = Math.sin(f.a) * ra;
      ctx.beginPath(); ctx.arc(hx, hy, f.size * 4.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue},100%,72%,0.26)`; ctx.fill();
      ctx.beginPath(); ctx.arc(hx, hy, f.size * 1.55, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${f.hue},100%,97%,1)`;
      ctx.shadowColor = `hsla(${f.hue},100%,70%,1)`;
      ctx.shadowBlur = 18; ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  function spawnBurst(angle, radius, hue, count) {
    for (let i = 0; i < count; i++) {
      const a = angle + (Math.random() - 0.5) * 0.7;
      const sp = 1.0 + Math.random() * 3.4;
      bursts.push({
        x: Math.cos(angle) * radius, y: Math.sin(angle) * radius,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1,
        decay: 0.008 + Math.random() * 0.014,
        size: 1.0 + Math.random() * 2.6,
        hue: hue + (Math.random() - 0.5) * 34
      });
    }
  }

  function drawBursts(px, py) {
    if (!bursts.length) return;
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      b.life -= b.decay;
      if (b.life <= 0) { bursts.splice(i, 1); continue; }
      b.x += b.vx; b.y += b.vy; b.vx *= 0.968; b.vy *= 0.968;
      const a = b.life * b.life * 0.95;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size * b.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${b.hue},100%,86%,${a})`; ctx.fill();
      ctx.beginPath(); ctx.arc(b.x, b.y, b.size * 3.6 * b.life, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${b.hue},100%,70%,${a * 0.16})`; ctx.fill();
    }
    ctx.restore();
  }

  function drawPulses(ts, dt, px, py) {
    if (ts - lastPulse > 1600) { lastPulse = ts; pulses.push(0); }
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = pulses.length - 1; i >= 0; i--) {
      pulses[i] += dt / 2100;
      const p = pulses[i];
      if (p >= 1) { pulses.splice(i, 1); continue; }
      const rr = innerR + (maxR - innerR) * easeOutCubic(p);
      const fade = Math.pow(1 - p, 1.5);
      const hue = hueAt(p);
      ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.strokeStyle = `hsla(${hue},100%,74%,${fade * 0.55})`;
      ctx.lineWidth = 1.8;
      ctx.shadowColor = `hsla(${hue},100%,66%,${fade * 0.9})`;
      ctx.shadowBlur = 26; ctx.stroke();
    }
    ctx.restore();
  }

  function drawHover(px, py) {
    if (hoverIdx < 0) return;
    const i = hoverIdx;
    const hue = hueAt(i / ((N - 1) || 1));
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    ringPath(ctx, radii[i], radii[i + 1], 150);
    ctx.fillStyle = `hsla(${hue},100%,74%,0.20)`; ctx.fill();
    strokeCircle(ctx, radii[i + 1], 150);
    ctx.strokeStyle = `hsla(${hue},100%,94%,1)`;
    ctx.lineWidth = 2.6;
    ctx.shadowColor = `hsla(${hue},100%,68%,1)`;
    ctx.shadowBlur = 34; ctx.stroke();
    strokeCircle(ctx, radii[i], 150);
    ctx.strokeStyle = `hsla(${hue},100%,84%,0.75)`;
    ctx.lineWidth = 1.3; ctx.shadowBlur = 14; ctx.stroke();
    const a = (performance.now() / 620) % (Math.PI * 2);
    const rr = radii[i + 1] + 6;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${hue},100%,96%,1)`;
    ctx.shadowColor = `hsla(${hue},100%,72%,1)`;
    ctx.shadowBlur = 24; ctx.fill();
    ctx.restore();
  }

  function drawLivingRing(ts, px, py) {
    const ph = 0.5 + 0.5 * Math.sin(ts / 700);
    const hue = hueAt(1);
    ctx.save();
    ctx.translate(px, py);
    ctx.globalCompositeOperation = 'lighter';
    strokeCircle(ctx, radii[N], 170);
    ctx.strokeStyle = `hsla(${hue},100%,86%,${0.26 + 0.52 * ph})`;
    ctx.lineWidth = 2.6;
    ctx.shadowColor = `hsla(${hue},100%,68%,${0.98 * ph})`;
    ctx.shadowBlur = 36; ctx.stroke();
    ctx.restore();
  }

  function drawCenter(ts, px, py) {
    ctx.save();
    ctx.translate(px, py);
    const veil = ctx.createRadialGradient(0, 0, 0, 0, 0, maxR * 0.32);
    veil.addColorStop(0,    'rgba(6,2,0,0.96)');
    veil.addColorStop(0.55, 'rgba(6,2,0,0.62)');
    veil.addColorStop(1,    'rgba(6,2,0,0)');
    ctx.fillStyle = veil;
    ctx.beginPath(); ctx.arc(0, 0, maxR * 0.32, 0, Math.PI * 2); ctx.fill();

    const pulse = 1 + 0.18 * Math.sin(ts / 500);
    const coreR = Math.max(10, innerR * 2.0) * pulse;

    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, coreR * 3.6);
    cg.addColorStop(0.00, 'rgba(255,255,250,0.98)');
    cg.addColorStop(0.16, `hsla(${TH.accent},100%,80%,0.68)`);
    cg.addColorStop(0.48, `hsla(${TH.accent},100%,60%,0.20)`);
    cg.addColorStop(1.00, 'rgba(0,0,0,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(0, 0, coreR * 3.6, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    ctx.save();
    ctx.rotate(ts / 5000);
    ctx.strokeStyle = `hsla(${TH.accent},100%,74%,0.34)`;
    ctx.lineWidth = 0.7;
    const rr = Math.max(15, innerR * 2.6);
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();

    let main, sub, hue;
    if (hoverIdx >= 0) {
      const yr = START_YEAR + hoverIdx;
      main = String(yr);
      sub  = hoverIdx === 0 ? '起 点' : (yr - START_YEAR) + ' 岁';
      hue  = hueAt(hoverIdx / ((N - 1) || 1));
    } else {
      main = String(ageNow); sub = '岁'; hue = TH.accent;
    }

    const fs = clamp(maxR * 0.098, 20, 40);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `600 ${fs}px "Songti SC","Noto Serif SC","STSong",serif`;
    ctx.fillStyle = '#fffaf2';
    ctx.shadowColor = `hsla(${hue},100%,66%,1)`;
    ctx.shadowBlur = 32;
    ctx.fillText(main, 0, -fs * 0.36);
    ctx.shadowBlur = 18;
    ctx.font = `400 ${fs * 0.36}px "Songti SC","Noto Serif SC","STSong",serif`;
    ctx.fillStyle = `hsla(${hue},100%,86%,.92)`;
    ctx.fillText(sub, 0, fs * 0.62);
    ctx.restore();
  }

  function placeLabel() {
    const pad = 8;
    const w = plabel.offsetWidth  || 90;
    const h = plabel.offsetHeight || 46;

    let x, y;
    if (touchMode) {
      x = mx - w / 2;
      y = my - h - 34;
      if (y < pad) y = my + 40;
    } else {
      x = mx + 22;
      y = my - 26;
      if (x + w > W - pad) x = mx - w - 22;
      if (y < pad) y = my + 26;
    }

    x = clamp(x, pad, Math.max(pad, W - w - pad));
    y = clamp(y, pad, Math.max(pad, H - h - pad));

    plabel.style.transform =
      `translate3d(${Math.round(x)}px, ${Math.round(y)}px, 0)`;
  }

  function updateLabel() {
    if (hoverIdx < 0) {
      plabel.classList.remove('show');
      return;
    }
    const yr  = START_YEAR + hoverIdx;
    const hue = hueAt(hoverIdx / ((N - 1) || 1));
    const sub = hoverIdx === 0 ? '起 点' : (yr - START_YEAR) + ' 岁';

    if (plYr.textContent !== String(yr)) plYr.textContent = yr;
    if (plDt.textContent !== sub)       plDt.textContent = sub;
    plabel.style.setProperty('--h', hue.toFixed(1));

    if (labelDirty || !plabel.classList.contains('show')) {
      placeLabel();
      labelDirty = false;
    }
    plabel.classList.add('show');
  }

  function frame(ts) {
    const dt = Math.min(60, ts - prevT);
    prevT = ts;
    const time = ts / 1000;

    wx += (twx - wx) * 0.08;
    wy += (twy - wy) * 0.08;

    const introE = easeOutCubic(clamp((ts - T0) / 2000, 0, 1));
    const sc = 0.28 + 0.72 * introE;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawSpace(time);

    if (off) {
      const px = cx + wx;
      const py = cy + wy;
      const dw = W * sc, dh = H * sc;
      const dx = px - cx * sc, dy = py - cy * sc;
      const breathScale = 1 + 0.006 * Math.sin(ts / 1400);

      ctx.globalAlpha = introE;
      ctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(off, 0, 0, off.width, off.height,
                    dx, dy, dw * breathScale, dh * breathScale);

      if (introE > 0.5) {
        drawMotes(time, px, py, dt);
        drawFlows(time, px, py);
        drawPulses(ts, dt, px, py);
        drawLivingRing(ts, px, py);
        drawHover(px, py);
        drawBursts(px, py);
      }

      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      drawCenter(ts, px, py);
    }

    if (hoverIdx !== prevHoverIdx) {
      if (hoverIdx >= 0) {
        const hue = hueAt(hoverIdx / ((N - 1) || 1));
        const rMid = (radii[hoverIdx] + radii[hoverIdx + 1]) / 2;
        for (let k = 0; k < 48; k++) {
          spawnBurst((k / 48) * Math.PI * 2, rMid, hue, 5);
        }
      }
      prevHoverIdx = hoverIdx;
      labelDirty = true;
    }

    updateLabel();
    requestAnimationFrame(frame);
  }

  function pickAt(clientX, clientY) {
    if (!radii.length || W < 10) return -1;
    const rect = cv.getBoundingClientRect();
    const x = (clientX - rect.left) * (W / (rect.width  || W));
    const y = (clientY - rect.top ) * (H / (rect.height || H));

    const dx = x - (cx + wx);
    const dy = y - (cy + wy);
    const d  = Math.sqrt(dx * dx + dy * dy);

    if (d < radii[0] || d > radii[N]) return -1;

    let lo = 0, hi = N - 1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (d < radii[mid]) hi = mid - 1;
      else if (d >= radii[mid + 1]) lo = mid + 1;
      else return mid;
    }
    return -1;
  }

  function onPointerMove(e) {
    touchMode = (e.pointerType === 'touch');

    const rect = cv.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    mx = x * (W / (rect.width  || W));
    my = y * (H / (rect.height || H));

    twx = ((x / (rect.width  || 1)) * 2 - 1) * 12;
    twy = ((y / (rect.height || 1)) * 2 - 1) * 12;

    hoverIdx = pickAt(e.clientX, e.clientY);
    labelDirty = true;
  }

  cv.addEventListener('pointermove', onPointerMove, { passive: true });

  cv.addEventListener('pointerdown', function (e) {
    if (e.pointerType !== 'touch') return;
    onPointerMove(e);
  }, { passive: true });

  cv.addEventListener('pointerleave', function (e) {
    if (e.pointerType === 'touch') return;
    hoverIdx = -1;
    labelDirty = true;
  }, { passive: true });

  cv.addEventListener('pointercancel', function () {
    if (!touchMode) { hoverIdx = -1; labelDirty = true; }
  }, { passive: true });

  let layoutTimer = 0;
  function scheduleLayout() {
    clearTimeout(layoutTimer);
    layoutTimer = setTimeout(layout, 80);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(scheduleLayout).observe(stageWrap);
  }
  window.addEventListener('resize', scheduleLayout, { passive: true });
  window.addEventListener('orientationchange', scheduleLayout, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleLayout, { passive: true });
    window.visualViewport.addEventListener('scroll', scheduleLayout, { passive: true });
  }

  layout();
  applyTheme('kiln');
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(scheduleLayout);
  }
  setTimeout(scheduleLayout, 300);
  requestAnimationFrame(frame);
})();
</script>
