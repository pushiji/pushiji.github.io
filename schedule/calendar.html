<title>吉度日历</title>
<style>
:root {
  --bg: #eef0f3;
  --card: #ffffff;
  --text: #1a1d24;
  --text-sub: #7a8290;
  --text-light: #b8bec7;
  --red: #d94a4a;
  --red-soft: #fdf0f0;
  --orange: #e08a3a;
  --orange-soft: #fef5ea;
  --blue: #5b72c9;
  --blue-soft: #eef1fb;
  --blue-grad: linear-gradient(135deg, #6176cc 0%, #4f66c2 100%);
  --green: #2d9666;
  --green-soft: #eaf6f0;
  --purple: #7c5ec9;
  --gold: #c9a961;
  --line: #f0f1f3;
  --line-dark: #e6e8eb;
  --shadow: 0 1px 2px rgba(15,20,30,.03), 0 12px 32px rgba(15,20,30,.06);
  --shadow-cell: 0 8px 20px rgba(79,102,194,.28);
  --radius-card: 20px;
  --radius-cell: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}

.page {
  max-width: 1220px;
  margin: 0 auto;
  padding: 10px 16px 32px;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 14px;
  align-items: start;
}
.col-left { display: flex; flex-direction: column; gap: 12px; }
.col-right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow); overflow: hidden; width: 100%; }

/* 容器查询锚点：让下方 @container 规则跟随 #app 实际宽度（而非浏览器视口）自适应，
   这样无论直接嵌入 Hexo 正文还是放进 iframe，都能正确切换单/双栏 */
#app { width: 100%; container-type: inline-size; }

.section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a5160; font-weight: 600; letter-spacing: .5px; margin-bottom: 16px; }
.section-title .bar { width: 3px; height: 14px; border-radius: 2px; }
.section-title .bar.orange { background: var(--orange); }
.section-title .bar.purple { background: linear-gradient(180deg, var(--purple), var(--blue)); }
.section-title .bar.red    { background: linear-gradient(180deg, var(--red), var(--orange)); }
.section-title .count { margin-left: auto; font-size: 11px; color: var(--text-light); background: #f4f5f7; padding: 2px 8px; border-radius: 10px; font-weight: 500; letter-spacing: 0; }

/* ============================================================
   模块 1 · 大时间卡
   ============================================================ */
.hero-card { padding: 18px 24px 16px; background: #ffffff; text-align: center; position: relative; }
.hero-time { font-size: 46px; font-weight: 700; line-height: 1.1; letter-spacing: -2px; color: #1a1d24; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
.hero-date-line { font-size: 13px; font-weight: 700; color: var(--red); letter-spacing: .3px; line-height: 1.55; font-variant-numeric: tabular-nums; margin-bottom: 4px; word-break: break-word; }
.hero-lunar-line { font-size: 13px; font-weight: 700; color: var(--red); letter-spacing: .3px; line-height: 1.55; font-variant-numeric: tabular-nums; word-break: break-word; margin-bottom: 14px; }

/* ============================================================
   年度进度条（百分比浮标版 · 纯天数标题）
   ============================================================ */
.year-progress {
  text-align: left;
  padding-top: 14px;
  border-top: 1px dashed var(--line-dark);
}

.year-progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
  gap: 10px;
  min-height: 18px;
}
.year-progress-head .yp-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  letter-spacing: .2px;
  white-space: nowrap;
  min-width: 0;
}
.year-progress-head .yp-dot {
  flex: 0 0 auto;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--blue), var(--purple));
}
.year-progress-head .yp-days {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
  letter-spacing: .1px;
}
.year-progress-head .yp-days .cur {
  font-size: 14px;
  font-weight: 700;
  color: #303640;
  letter-spacing: -.2px;
}
.year-progress-head .yp-days .sep,
.year-progress-head .yp-days .total,
.year-progress-head .yp-days .unit {
  color: var(--text-light);
  font-weight: 500;
}
.year-progress-head .yp-left {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-light);
  font-variant-numeric: tabular-nums;
  letter-spacing: .2px;
  white-space: nowrap;
}

.year-progress-bar-wrap {
  position: relative;
  padding-top: 18px;
}

.year-progress-percent {
  position: absolute;
  top: 0;
  left: 0;
  transform: translateX(-50%);
  font-size: 12px;
  font-weight: 700;
  color: var(--blue);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.2px;
  line-height: 1.1;
  white-space: nowrap;
  transition: left .3s ease;
  z-index: 3;
}
.year-progress-percent.edge-left {
  transform: translateX(0);
}
.year-progress-percent.edge-right {
  transform: translateX(0);
  left: auto !important;
  right: 0;
}

.year-progress-bar {
  position: relative;
  height: 8px;
  border-radius: 4px;
  background: #f0f2f5;
  overflow: hidden;
}
.year-progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  border-radius: 4px;
  background: linear-gradient(90deg, #8596d9 0%, #5b72c9 45%, #7c5ec9 100%);
  transition: width .3s ease;
}
.year-progress-quarter {
  position: absolute;
  top: 0; bottom: 0;
  width: 1px;
  background: rgba(255,255,255,.75);
}
.year-progress-quarter.q1 { left: 24.66%; }
.year-progress-quarter.q2 { left: 49.59%; }
.year-progress-quarter.q3 { left: 74.79%; }

.year-progress-marker {
  position: absolute;
  top: 22px;
  transform: translate(-50%, -50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--blue);
  box-shadow: 0 1px 3px rgba(91,114,201,.35);
  transition: left .3s ease;
  z-index: 2;
  pointer-events: none;
}

.year-progress-footer {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  text-align: center;
  margin-top: 6px;
  font-size: 10px;
  color: var(--text-light);
  letter-spacing: .2px;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   模块 2 · 节气卡
   ============================================================ */
.term-card { padding: 16px 22px 16px; }

.term-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.term-head-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #4a5160;
  font-weight: 600;
  letter-spacing: .5px;
}
.term-head-title .bar {
  width: 3px;
  height: 14px;
  border-radius: 2px;
  background: var(--orange);
}
.term-season-tag {
  font-size: 11px;
  color: var(--orange);
  background: var(--orange-soft);
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: .5px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.term-season-tag::before {
  content: '';
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
}

.term-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.term-name { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: .5px; line-height: 1.2; }
.term-name.next { color: var(--orange); }
.term-date { font-size: 13px; color: var(--text-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.term-bar { position: relative; height: 6px; border-radius: 3px; background: #f0f2f5; margin: 12px 0 10px; }
.term-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #f0b866, var(--orange)); }
.term-bar-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--orange); box-shadow: 0 1px 4px rgba(224,138,58,.35); }
.term-tip { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
.term-tip .hl { color: var(--orange); font-weight: 600; }

.term-hou {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--line-dark);
  font-size: 12.5px;
  line-height: 1.4;
}
.hou-title {
  font-size: 11px;
  color: var(--orange);
  background: var(--orange-soft);
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: 700;
  letter-spacing: 1px;
  flex: 0 0 auto;
}
.hou-name {
  color: var(--text);
  font-weight: 600;
  flex: 1;
  letter-spacing: .3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.hou-progress {
  color: var(--text-sub);
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  font-size: 12px;
  flex: 0 0 auto;
}
.hou-progress .hou-num {
  color: var(--orange);
  font-weight: 600;
}

/* ============================================================
   模块 3 · 月相卡
   ============================================================ */
.moon-card { padding: 16px 22px 18px; }

.moon-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.moon-visual {
  flex: 0 0 72px; height: 72px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px; line-height: 1; position: relative;
  background: radial-gradient(circle at 72% 26%, rgba(140,105,220,.35), transparent 55%),
              radial-gradient(circle at 26% 74%, rgba(220,180,80,.30), transparent 55%),
              radial-gradient(circle at 40% 40%, #26213a 0%, #16131f 70%);
  box-shadow: inset -6px -6px 18px rgba(0,0,0,.55),
              inset 4px 4px 12px rgba(140,105,220,.14),
              0 6px 18px rgba(20,15,40,.28);
  overflow: hidden;
}
.moon-visual::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.10), transparent 45%);
  pointer-events: none;
}
.moon-visual .moon-emoji {
  position: relative; z-index: 1;
  filter: drop-shadow(0 0 8px rgba(220,180,80,.35));
}

.moon-info { flex: 1; min-width: 0; }
.moon-name { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: .5px; line-height: 1.2; }
.moon-idx { font-size: 12.5px; color: var(--text-sub); margin-top: 4px; font-variant-numeric: tabular-nums; }
.moon-idx .age-num { color: var(--blue); font-weight: 600; }

.moon-track {
  position: relative;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  align-items: end;
  padding-top: 6px;
}
.moon-track::before {
  content: '';
  position: absolute;
  left: 6.25%;
  right: 6.25%;
  top: 20px;
  height: 2px;
  background: #eef1f5;
  border-radius: 1px;
  z-index: 0;
}
.moon-track-fill {
  position: absolute;
  left: 6.25%;
  top: 20px;
  height: 2px;
  background: linear-gradient(90deg, #8596d9, #5b72c9 40%, #7c5ec9);
  border-radius: 1px;
  z-index: 1;
  transition: width .3s ease;
}

.moon-node {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: opacity .25s ease;
}
.moon-node.past { opacity: 1; }
.moon-node.future { opacity: .35; }
.moon-node.active { opacity: 1; }

.moon-node .icon {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  line-height: 1;
  background: #fff;
  box-shadow: 0 0 0 3px #fff;
  transition: all .25s ease;
}
.moon-node .label {
  font-size: 10px;
  color: var(--text-light);
  letter-spacing: 0;
  white-space: nowrap;
  transition: color .2s ease, font-weight .2s ease;
}

.moon-node.active .icon {
  transform: scale(1.15);
  box-shadow:
    0 0 0 3px #fff,
    0 0 0 5px rgba(91,114,201,.22);
}
.moon-node.active .label {
  color: var(--blue);
  font-weight: 700;
}

/* ============================================================
   模块 4 · 节日卡
   ============================================================ */
.festival-card { padding: 16px 22px 12px; }
.fest-range { display: flex; gap: 6px; margin-bottom: 12px; background: #f4f5f7; padding: 3px; border-radius: 10px; }
.fest-range button { flex: 1; border: none; background: transparent; color: var(--text-sub); font-size: 12px; font-weight: 500; padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: all .15s ease; font-family: inherit; }
.fest-range button:hover { color: var(--text); }
.fest-range button.active { background: #ffffff; color: var(--red); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }

.fest-list { position: relative; }
.fest-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.fest-row + .fest-row { border-top: 1px dashed var(--line); }

.fest-icon { flex: 0 0 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.fest-icon.tone-cake   { background: linear-gradient(135deg, #fef4d2 0%, #fde1a3 100%); }
.fest-icon.tone-red    { background: linear-gradient(135deg, #fde5e4 0%, #fbd2d0 100%); }
.fest-icon.tone-pink   { background: linear-gradient(135deg, #fce7f3 0%, #f7d3e8 100%); }
.fest-icon.tone-gold   { background: linear-gradient(135deg, #fdeacc 0%, #fbd9a3 100%); }
.fest-icon.tone-green  { background: linear-gradient(135deg, #e3f6ec 0%, #c9ecd9 100%); }
.fest-icon.tone-blue   { background: linear-gradient(135deg, #e3ecfb 0%, #c8dbf5 100%); }
.fest-icon.tone-purple { background: linear-gradient(135deg, #ede4fb 0%, #ddc9f5 100%); }

.fest-info { flex: 1; min-width: 0; }
.fest-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: .2px; line-height: 1.25; display: flex; align-items: center; gap: 6px; }
.fest-tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 500; letter-spacing: .3px; white-space: nowrap; }
.fest-tag.legal { background: var(--red-soft); color: var(--red); }
.fest-tag.lunar { background: var(--orange-soft); color: var(--orange); }
.fest-tag.solar { background: var(--blue-soft); color: var(--blue); }
.fest-sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; font-variant-numeric: tabular-nums; }
.fest-days { font-size: 16px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.2px; }
.fest-days.today { font-size: 13px; color: #fff; background: var(--red); padding: 3px 10px; border-radius: 12px; letter-spacing: 0; }
.fest-days.ongoing { font-size: 13px; color: #fff; background: var(--green); padding: 3px 10px; border-radius: 12px; letter-spacing: 0; }

.fest-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; padding: 10px 0 4px; border-top: 1px dashed var(--line); color: var(--blue); font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none; transition: opacity .15s ease; }
.fest-toggle:hover { opacity: .75; }
.fest-toggle .chev { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transition: transform .2s ease; }
.fest-toggle.expanded .chev { transform: rotate(180deg); }

.fest-scroll { max-height: 360px; overflow-y: auto; scrollbar-width: thin; margin: 0 -22px; padding: 0 22px; }
.fest-scroll::-webkit-scrollbar { width: 4px; }
.fest-scroll::-webkit-scrollbar-thumb { background: #e3e6ea; border-radius: 2px; }
.fest-scroll::-webkit-scrollbar-track { background: transparent; }

.fest-empty { text-align: center; padding: 30px 0 20px; color: var(--text-light); font-size: 13px; }

/* ============================================================
   模块 5 · 日历卡
   ============================================================ */
.calendar-card { padding: 18px 20px 16px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 14px; gap: 10px; }
.cal-title { font-size: 21px; font-weight: 700; letter-spacing: .2px; color: var(--text); display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-title .year { font-size: 14px; font-weight: 500; color: var(--text-sub); }
.cal-title .month-num { font-size: 21px; font-weight: 700; color: var(--text); }

.cal-nav { display: flex; gap: 3px; align-items: center; }
.cal-nav button { min-width: 32px; height: 32px; border: none; background: transparent; color: var(--text-sub); font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 9px; transition: background .15s ease, color .15s ease, transform .1s ease; font-family: inherit; padding: 0; user-select: none; }
.cal-nav button:hover { background: #f4f5f7; color: var(--text); }
.cal-nav button:active { transform: scale(.92); }
.cal-nav button.year-btn { font-size: 16px; font-weight: 400; color: var(--text-light); letter-spacing: -1px; }
.cal-nav button.year-btn:hover { color: var(--blue); background: var(--blue-soft); }
.cal-nav button.today-btn { min-width: auto; padding: 0 12px; font-size: 12.5px; font-weight: 600; color: var(--red); background: var(--red-soft); }
.cal-nav button.today-btn:hover { background: #fbe3e3; }

.cal-dow-row { display: grid; grid-template-columns: repeat(7, 1fr); padding-bottom: 6px; }
.cal-dow { text-align: center; font-size: 13px; font-weight: 500; color: var(--text-sub); padding: 6px 0 10px; letter-spacing: .5px; }
.cal-dow.weekend { color: var(--red); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 2px; min-height: 74px; border-radius: var(--radius-cell); cursor: pointer; transition: background .12s ease, box-shadow .15s ease; user-select: none; contain: layout style; }
.cal-cell:hover { background: #f7f8fa; }
.cal-cell.other-month { opacity: .28; pointer-events: none; }

.cal-cell .day-num { font-size: 19px; font-weight: 600; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.cal-cell.weekend .day-num { color: var(--red); }
.cal-cell .day-label { font-size: 10.5px; line-height: 1.2; margin-top: 6px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 6px); text-align: center; letter-spacing: .1px; }
.cal-cell .day-label.term { color: var(--orange); font-weight: 500; }
.cal-cell .day-label.festival { color: var(--red); font-weight: 500; }

.cal-cell.selected:not(.today) {
  background: linear-gradient(135deg, #f1f4fc 0%, #e8edf9 100%);
  box-shadow: inset 0 0 0 1.5px rgba(91, 114, 201, .45), 0 2px 6px rgba(91, 114, 201, .08);
}
.cal-cell.selected:not(.today):hover { background: linear-gradient(135deg, #eaeefa 0%, #dee5f6 100%); }
.cal-cell.selected:not(.today) .day-num { color: var(--blue); font-weight: 700; }
.cal-cell.selected:not(.today) .day-label { color: var(--blue); font-weight: 500; }
.cal-cell.selected:not(.today) .day-label.term { color: var(--orange); }
.cal-cell.selected:not(.today) .day-label.festival { color: var(--red); }

.cal-cell.today { background: var(--blue-grad); box-shadow: var(--shadow-cell); }
.cal-cell.today:hover { background: var(--blue-grad); }
.cal-cell.today .day-num { color: #ffffff; }
.cal-cell.today .day-label { color: rgba(255, 255, 255, .9); }
.cal-cell.today .day-label.term, .cal-cell.today .day-label.festival { color: #ffe4e4; }

.cal-cell .badge { position: absolute; top: 4px; right: 4px; font-size: 9.5px; line-height: 15px; min-width: 15px; padding: 0 4px; border-radius: 5px; font-weight: 600; color: #ffffff; background: var(--red); letter-spacing: .2px; text-align: center; }
.cal-cell .badge.work { background: var(--text-sub); }
.cal-cell.today .badge { background: rgba(255, 255, 255, .3); color: #ffffff; }
.cal-cell.selected:not(.today) .badge { background: var(--red); }

.cal-cell .moon-dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 3.5px; height: 3.5px; border-radius: 50%; }
.cal-cell .moon-dot.moon-0 { background: #4a5568; }
.cal-cell .moon-dot.moon-1 { background: #6b8ec2; }
.cal-cell .moon-dot.moon-2 { background: #93b8dc; }
.cal-cell .moon-dot.moon-3 { background: #b8cfe8; }
.cal-cell .moon-dot.moon-4 { background: #d4b05c; }
.cal-cell .moon-dot.moon-5 { background: #d9b76b; }
.cal-cell .moon-dot.moon-6 { background: #b8945a; }
.cal-cell .moon-dot.moon-7 { background: #8b7355; }
.cal-cell.today .moon-dot { background: rgba(255, 255, 255, .8) !important; }

/* ============================================================
   模块 6 · 黄历详情卡
   ============================================================ */
.almanac-card { padding: 20px 26px; }
.yiji-list { padding: 0 0 16px; border-bottom: 1px dashed var(--line-dark); }
.yiji-row { display: flex; gap: 12px; padding: 6px 0; align-items: flex-start; }
.yiji-row + .yiji-row { padding-top: 12px; }
.yiji-icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px; }
.yiji-icon.y { background: linear-gradient(135deg, #3eb87a, var(--green)); }
.yiji-icon.j { background: linear-gradient(135deg, #e05858, var(--red)); }
.yiji-body { flex: 1; font-size: 13.5px; color: #303640; line-height: 1.9; }
.yiji-body .tag { display: inline-block; margin-right: 10px; white-space: nowrap; }
.triple-row { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 0; border-bottom: 1px dashed var(--line-dark); }
.triple-cell { text-align: center; padding: 0 10px; border-right: 1px solid var(--line); }
.triple-cell:last-child { border-right: none; }
.triple-key { font-size: 11.5px; color: var(--text-light); margin-bottom: 6px; letter-spacing: .5px; }
.triple-val { font-size: 14px; color: #303640; font-weight: 500; }
.triple-val.red { color: var(--red); }
.hours-section { padding: 16px 0; border-bottom: 1px dashed var(--line-dark); }
.hours-title { font-size: 12px; color: var(--text-sub); font-weight: 600; letter-spacing: 1px; margin-bottom: 12px; }
.hours-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -26px; padding: 0 26px; }
.hours-scroll::-webkit-scrollbar { display: none; }
.hours-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 100%; }
.hour-cell { background: #fff; padding: 9px 2px; text-align: center; position: relative; }
.hour-cell.now { background: linear-gradient(180deg, #eef3fc, #f6f9ff); }
.hour-cell.now::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--blue); }
.hour-cell .hz { font-size: 13px; font-weight: 600; color: var(--text); }
.hour-cell .gz { font-size: 10.5px; color: var(--text-light); margin: 3px 0; line-height: 1.2; }
.hour-cell .jl { font-size: 11px; font-weight: 700; }
.hour-cell .jl.y { color: var(--green); }
.hour-cell .jl.n { color: var(--red); }
.quad { display: grid; grid-template-columns: 90px 1fr 1fr 1fr; padding-top: 16px; }
.quad-cell { padding: 4px 12px; border-right: 1px solid var(--line); text-align: center; }
.quad-cell:last-child { border-right: none; }
.quad-key { font-size: 11.5px; color: var(--text-light); margin-bottom: 8px; letter-spacing: .5px; }
.quad-val { font-size: 12.5px; color: #4a5160; line-height: 1.7; }
.duty-big { font-size: 26px; font-weight: 700; color: #303640; letter-spacing: 4px; line-height: 1; }
.pengzu { grid-column: 1 / -1; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-dark); text-align: center; font-size: 12.5px; color: #4a5160; }
.pengzu .lbl { display: inline-block; color: var(--red); font-weight: 600; margin-right: 8px; padding: 1px 8px; border-radius: 10px; background: var(--red-soft); font-size: 11px; }

/* 加载 / 错误 */
.loading { text-align: center; padding: 120px 20px; color: var(--text-sub); font-size: 13px; }
.spinner { width: 26px; height: 26px; border: 3px solid #e3e6ea; border-top-color: var(--blue); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { padding: 14px 18px; background: #fef2f2; color: #b91c1c; border-radius: 12px; font-size: 13px; text-align: center; max-width: 500px; margin: 40px auto; }

/* 响应式 */

  .page { display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 10px 12px 28px; }
  .col-left, .col-right { display: contents; }
  .page > .card, .col-left > .card, .col-right > .card, .page .card { width: 100%; max-width: 100%; min-width: 0; }
  .hero-card     { order: 1; }
  .calendar-card { order: 2; }
  .term-card     { order: 3; }
  .moon-card     { order: 4; }
  .festival-card { order: 5; }
  .almanac-card  { order: 6; }
}

@media (max-width: 560px) {
  .page { padding: 8px 10px 22px; }
  .hero-card { padding: 16px 18px 14px; }
  .hero-time { font-size: 44px; letter-spacing: -2px; margin-bottom: 12px; }
  .hero-date-line, .hero-lunar-line { font-size: 12px; letter-spacing: .2px; }
  .hero-lunar-line { margin-bottom: 12px; }

  .year-progress-head .yp-days .cur { font-size: 13px; }
  .year-progress-head .yp-left { font-size: 10.5px; }
  .year-progress-bar-wrap { padding-top: 16px; }
  .year-progress-percent { font-size: 11.5px; }
  .year-progress-marker { top: 20px; width: 11px; height: 11px; border-width: 2px; }
  .year-progress-footer { font-size: 9.5px; margin-top: 5px; }

  .term-card { padding: 14px 18px; }
  .term-head { margin-bottom: 12px; }
  .term-season-tag { font-size: 10.5px; padding: 2px 8px; }
  .term-name { font-size: 17px; }
  .term-name.next { font-size: 16px; }
  .term-hou { font-size: 12px; padding-top: 12px; margin-top: 12px; gap: 8px; }
  .hou-title { font-size: 10.5px; padding: 1px 7px; }

  .moon-card { padding: 14px 18px; }

  .moon-name { font-size: 17px; }
  .moon-idx { font-size: 12px; }
  .moon-node .icon { width: 24px; height: 24px; font-size: 15px; }
  .moon-node .label { font-size: 9px; }
  .moon-track::before { top: 18px; }

  .festival-card { padding: 14px 18px 10px; }
  .fest-icon { flex: 0 0 36px; height: 36px; font-size: 18px; border-radius: 10px; }

  .cal-title .month-num { font-size: 17px; }
  .cal-nav { gap: 1px; }
  .cal-nav button { min-width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
  .cal-nav button.year-btn { font-size: 14px; }

  .duty-big { font-size: 22px; }
}

@media (max-width: 360px) {
  .hero-time { font-size: 40px; letter-spacing: -1.5px; }
  .hero-date-line, .hero-lunar-line { font-size: 11.5px; }
  .cal-cell { min-height: 58px; }
  .cal-cell .day-num { font-size: 15px; }
  .cal-cell .day-label { font-size: 9px; }
  .cal-cell .badge { font-size: 8.5px; line-height: 13px; min-width: 13px; top: 3px; right: 3px; }
  .moon-node .label { font-size: 8px; }
  .moon-node .icon { width: 20px; height: 20px; font-size: 13px; }

}

  .calendar-card { order: 2; }
  .term-card     { order: 3; }
  .moon-card     { order: 4; }
  .festival-card { order: 5; }
  .almanac-card  { order: 6; }
}

  .page { padding: 8px 10px 22px; }
  .hero-card { padding: 16px 18px 14px; }

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c])); }
function safe(fn, fallback = '') { try { const v = fn(); return v == null ? fallback : v; } catch (e) { return fallback; } }
function nameOf(obj, fallback = '—') { if (obj == null) return fallback; if (typeof obj === 'string') return obj; try { if (typeof obj.getName === 'function') return obj.getName(); } catch (_) {} try { return String(obj); } catch (_) { return fallback; } }

function getToday() { const n = new Date(); return { year: n.getFullYear(), month: n.getMonth() + 1, day: n.getDate(), hour: n.getHours(), minute: n.getMinutes() }; }

/* ============================================================
 * 模块 3 · 数据模型层（多级缓存 + 计算/过滤分离）
   ============================================================ */
const Model = {

  /* ---------- 缓存容器 ---------- */
  _c: {
    lunar: new Map(),
    dayInfo: new Map(),
    festival: new Map(),
    almanac: new Map(),
    phase: new Map(),
    term: new Map(),
    grid: new Map(),
    yearProgress: new Map(),
  },

  _MAX: 1500,

  _prune() {
    if (this._c.lunar.size > this._MAX) {
      for (const k in this._c) this._c[k].clear();
    }
  },

  _dayKey(solar) {
    return `${solar.getYear()}-${solar.getMonth()}-${solar.getDay()}`;
  },

  /* ---------- 基础缓存 ---------- */

  getLunarAndCycle(solar) {
    const key = this._dayKey(solar);
    let v = this._c.lunar.get(key);
    if (v) return v;
    v = { lunar: solar.getLunarDay(), cycle: solar.getSixtyCycleDay() };
    this._c.lunar.set(key, v);
    this._prune();
    return v;
  },

  _getDayInfo(solar) {
    const key = this._dayKey(solar);
    let v = this._c.dayInfo.get(key);
    if (v) return v;
    const lunar = solar.getLunarDay();
    v = {
      lunar,
      holiday: solar.getLegalHoliday(),
      solarFest: solar.getFestival(),
      lunarFest: lunar.getFestival(),
      term: solar.getTerm(),
      phaseDay: solar.getPhaseDay(),
    };
    this._c.dayInfo.set(key, v);
    return v;
  },

  /* ---------- 日历网格 ---------- */

  buildGrid(year, month) {
    const key = `${year}-${month}`;
    let cells = this._c.grid.get(key);
    if (cells) return cells;

    const first = SolarDay.fromYmd(year, month, 1);
    const firstDow = first.getWeek().getIndex();
    const offset = (firstDow - WEEK_START + 7) % 7;
    const start = first.next(-offset);
    cells = new Array(42);
    for (let i = 0; i < 42; i++) cells[i] = start.next(i);
    this._c.grid.set(key, cells);
    return cells;
  },

  buildDay(solar, ctxYear, ctxMonth, selY, selM, selD) {
    const today = getToday();
    const info = this._getDayInfo(solar);
    const { lunar, holiday, solarFest, lunarFest, term, phaseDay } = info;
    const dow = solar.getWeek().getIndex();

    const isCurrentMonth = solar.getYear() === ctxYear && solar.getMonth() === ctxMonth;
    const isToday = solar.getYear() === today.year && solar.getMonth() === today.month && solar.getDay() === today.day;
    const isSelected = solar.getYear() === selY && solar.getMonth() === selM && solar.getDay() === selD;
    const isWeekend = dow === 0 || dow === 6;

    let isTermDay = false;
    if (term) {
      const td = term.getSolarDay();
      isTermDay = td.getYear() === solar.getYear() && td.getMonth() === solar.getMonth() && td.getDay() === solar.getDay();
    }

    let label = '', labelType = 'lunar';
    if (lunarFest) { label = lunarFest.getName(); labelType = 'festival'; }
    else if (solarFest) { label = solarFest.getName(); labelType = 'festival'; }
    else if (isTermDay) { label = term.getName(); labelType = 'term'; }
    else if (lunar.getDay() === 1) {
      const lm = lunar.getLunarMonth();
      label = lm.getName();
      if (lm.getMonthWithLeap() === 1) label = lm.getLunarYear().getSixtyCycle().getName() + '年' + label;
      labelType = 'month';
    } else {
      label = lunar.getName() + lunar.getSixtyCycle().getName();
    }

    const isMoonDay = phaseDay && phaseDay.getDayIndex() === 0;
    const moonIndex = isMoonDay ? phaseDay.getPhase().getIndex() : -1;

    return {
      solar, dayNum: solar.getDay(),
      isCurrentMonth, isToday, isSelected, isWeekend,
      label, labelType,
      holiday: holiday ? { isWork: holiday.isWork() } : null,
      isMoonDay, moonIndex,
    };
  },

  /* ---------- 年度进度 ---------- */

  buildYearProgress(solar) {
    const key = this._dayKey(solar);
    let v = this._c.yearProgress.get(key);
    if (v) return v;

    const year = solar.getYear();
    const dayIdx = safe(() => solar.getIndexInYear(), 0);
    const totalDays = safe(() => SolarYear.fromYear(year).getDayCount(), 365);
    const dayNum = dayIdx + 1;
    const progress = totalDays > 0 ? Math.max(0, Math.min(100, (dayNum / totalDays) * 100)) : 0;

    let percentAlign = 'center';
    if (progress < 8)       percentAlign = 'left';
    else if (progress > 92) percentAlign = 'right';

    v = {
      year, dayNum, totalDays,
      daysLeft: Math.max(0, totalDays - dayNum),
      progress,
      percentText: progress.toFixed(1) + '%',
      percentAlign,
    };
    this._c.yearProgress.set(key, v);
    return v;
  },

  /* ---------- 节气 ---------- */

  buildTermAround(solar) {
    const key = this._dayKey(solar);
    if (this._c.term.has(key)) return this._c.term.get(key);

    let prev = null;
    for (let i = 0; i <= 30; i++) {
      const d = solar.next(-i);
      const t = safe(() => d.getTerm(), null);
      if (t) { const td = safe(() => t.getSolarDay(), null); if (td && isSameDay(td, d)) { prev = { name: nameOf(t), solar: d }; break; } }
    }
    let next = null;
    for (let i = 1; i <= 30; i++) {
      const d = solar.next(i);
      const t = safe(() => d.getTerm(), null);
      if (t) { const td = safe(() => t.getSolarDay(), null); if (td && isSameDay(td, d)) { next = { name: nameOf(t), solar: d }; break; } }
    }
    if (!prev || !next) {
      this._c.term.set(key, null);
      return null;
    }

    const daysFromPrev = safe(() => solar.subtract(prev.solar), 0);
    const daysToNext   = safe(() => next.solar.subtract(solar), 0);
    const total = daysFromPrev + daysToNext;
    const progress = total > 0 ? (daysFromPrev / total) * 100 : 0;
    const fmtD = (d) => `${d.getMonth()}月${d.getDay()}日`;

    const lunar = safe(() => solar.getLunarDay(), null);
    const lunarMonth = lunar ? safe(() => lunar.getLunarMonth(), null) : null;
    const season = lunarMonth ? safe(() => lunarMonth.getSeason(), null) : null;
    const seasonName = season ? nameOf(season) : '';

    let houName = '';
    let houDayNum = 0;
    let houTotalDays = 5;
    const pd = safe(() => solar.getPhenologyDay(), null);
    if (pd) {
      const ph = safe(() => pd.getPhenology(), null);
      if (ph) houName = nameOf(ph);
      houDayNum = safe(() => pd.getDayIndex(), 0) + 1;
      const houStart = ph ? safe(() => ph.getSolarDay(), null) : null;
      const houNext = ph ? safe(() => ph.next(1), null) : null;
      const houNextStart = houNext ? safe(() => houNext.getSolarDay(), null) : null;
      if (houStart && houNextStart) {
        houTotalDays = Math.max(1, houNextStart.subtract(houStart));
      }
    }

    const v = {
      prevName: prev.name, prevDate: fmtD(prev.solar),
      nextName: next.name, nextDate: fmtD(next.solar),
      daysFromPrev, daysToNext,
      progress: Math.max(0, Math.min(100, progress)),
      seasonName, houName, houDayNum, houTotalDays,
    };
    this._c.term.set(key, v);
    return v;
  },

  /* ---------- 节日（计算 / 过滤分离） ---------- */

  buildFestivals(solar, maxDays) {
    const key = this._dayKey(solar);
    let all = this._c.festival.get(key);
    if (!all) {
      const map = new Map();
      for (const h of this._findHolidaysFromLegal(solar)) {
        if (!map.has(h.name)) map.set(h.name, h);
      }
      for (const f of this._findAllFestivals(solar, 400)) {
        if (!map.has(f.name)) map.set(f.name, f);
      }
      all = Array.from(map.values()).sort((a, b) => a.days - b.days);
      this._c.festival.set(key, all);
    }
    return all.filter(x => x.days <= maxDays || x.ongoing);
  },

  _findHolidaysFromLegal(today) {
    const list = [];
    const seen = new Set();
    const startYear = today.getYear();
    let cursor = LegalHoliday.fromYmd(startYear, 1, 1);
    if (!cursor) cursor = LegalHoliday.fromYmd(startYear - 1, 1, 1);
    if (!cursor) return [];

    const MAX_ITER = 800;
    let iter = 0;
    while (cursor && iter < MAX_ITER) {
      iter++;
      const name = cursor.getName();
      const day = cursor.getDay();
      const isWork = cursor.isWork();
      if (!seen.has(name) && !isWork) {
        let restCount = 1, firstDay = day, lastDay = day;
        let back = cursor.next(-1), backIter = 0;
        while (back && back.getName() === name && !back.isWork() && backIter < 60) {
          firstDay = back.getDay(); restCount++; back = back.next(-1); backIter++;
        }
        let forward = cursor.next(1), forwardIter = 0;
        while (forward && forward.getName() === name && !forward.isWork() && forwardIter < 60) {
          lastDay = forward.getDay(); restCount++; forward = forward.next(1); forwardIter++;
        }
        const daysToStart = firstDay.subtract(today);
        const daysToEnd = lastDay.subtract(today);
        if (daysToStart >= 0 || daysToEnd >= 0) {
          const meta = getFestivalMeta(name);
          list.push({
            name, icon: meta.emoji, tone: meta.tone, category: 'legal',
            days: Math.max(0, daysToStart), rest: restCount,
            date: firstDay,
            dateStr: `${firstDay.getMonth()}月${firstDay.getDay()}日`,
            ongoing: daysToStart < 0 && daysToEnd >= 0,
          });
          seen.add(name);
        }
      }
      cursor = cursor.next(1);
    }
    return list;
  },

  _findAllFestivals(today, maxDays = 400) {
    const list = [];
    const seen = new Set();
    for (let i = 0; i <= maxDays; i++) {
      const d = today.next(i);
      const lunar = safe(() => d.getLunarDay(), null);
      const dateStr = `${d.getMonth()}月${d.getDay()}日`;
      if (lunar) {
        const isLeap = safe(() => lunar.getLunarMonth().isLeap(), false);
        if (!isLeap) {
          const lf = safe(() => lunar.getFestival(), null);
          if (lf) {
            const name = nameOf(lf);
            if (name && name !== '—' && !seen.has(name)) {
              seen.add(name);
              const meta = getFestivalMeta(name);
              list.push({ name, icon: meta.emoji, tone: meta.tone, category: 'lunar',
                days: i, rest: 0, date: d, dateStr, ongoing: false });
            }
          }
        }
      }
      const sf = safe(() => d.getFestival(), null);
      if (sf) {
        const name = nameOf(sf);
        if (name && name !== '—' && !seen.has(name)) {
          seen.add(name);
          const meta = getFestivalMeta(name);
          list.push({ name, icon: meta.emoji, tone: meta.tone, category: 'solar',
            days: i, rest: 0, date: d, dateStr, ongoing: false });
        }
      }
      const t = safe(() => d.getTerm(), null);
      if (t) {
        const tn = nameOf(t);
        const td = safe(() => t.getSolarDay(), null);
        if (td && isSameDay(td, d) && (tn === '清明' || tn === '冬至')) {
          const festName = tn + '节';
          if (!seen.has(festName)) {
            seen.add(festName);
            const meta = getFestivalMeta(festName);
            list.push({ name: festName, icon: meta.emoji, tone: meta.tone, category: 'lunar',
              days: i, rest: 0, date: d, dateStr, ongoing: false });
          }
        }
      }
    }
    return list;
  },

  /* ---------- 月相 ---------- */

  buildPhase(solar, lunar) {
    const key = this._dayKey(solar);
    let v = this._c.phase.get(key);
    if (v) return v;

    const phase = safe(() => solar.getPhase(), null);
    const phaseDay = safe(() => solar.getPhaseDay(), null);

    const name = phase ? nameOf(phase) : '—';
    const emoji = PHASE_EMOJI[name] || '🌙';

    const phaseIdx = phase ? safe(() => phase.getIndex(), 0) : 0;
    const dayIdx = phaseDay ? safe(() => phaseDay.getDayIndex(), 0) : 0;

    let totalDays = 1;
    if (phase) {
      const startDate = safe(() => phase.getSolarDay(), null);
      const nextPhase = safe(() => phase.next(1), null);
      const nextStart = nextPhase ? safe(() => nextPhase.getSolarDay(), null) : null;
      if (startDate && nextStart) {
        totalDays = Math.max(1, nextStart.subtract(startDate));
      }
    }

    const inPhase = totalDays > 1
      ? Math.min(1, Math.max(0, dayIdx / totalDays))
      : 0;

    /* ------------------------------------------------------------------
     * 进度条填充宽度
     *
     * 轨道结构：8 个相位节点均匀排布，每列宽 12.5%，
     * 节点中心位置 = 6.25% + i × 12.5%（i = 0…7）。
     * 填充线左端固定于第一个节点中心（6.25%）。
     *
     * 填充宽度由两部分组成：
     *   基础宽度 = phaseIdx × 12.5%（从新月延伸到当前节点中心）
     *   额外宽度 = inPhase × 12.5%（在当前相位内向下一节点延伸）
     *
     * 关键修正：额外宽度最多延伸到「下一节点中心 − ICON_HALF_PCT」，
     * 其中 ICON_HALF_PCT ≈ 4.5%，约等于 28px 图标在一列（≈39.5px）中的
     * 半径占比。这样填充线的右端始终在下一节点图标的左边缘前停止，
     * 不会侵入图标内部（此前满月后尤其明显）。
     * ------------------------------------------------------------------ */
    const ICON_HALF_PCT = 4.5;

    const baseWidth  = phaseIdx * MOON_NODE_STEP;
    const extraWidth = phaseIdx < MOON_SEGMENTS
      ? Math.min(inPhase * MOON_NODE_STEP, MOON_NODE_STEP - ICON_HALF_PCT)
      : 0;
    const fillWidth  = Math.max(0, Math.min(baseWidth + extraWidth, MOON_SEGMENTS * MOON_NODE_STEP));

    const trackPos = Math.max(0, Math.min(MOON_SEGMENTS, phaseIdx + inPhase));
    const progress = (trackPos / MOON_SEGMENTS) * 100;

    const DAYS_PER_PHASE = 29.53 / 8;
    const moonAge = phaseIdx * DAYS_PER_PHASE + dayIdx + 0.5;

    v = {
      name, emoji, phaseIdx, dayIdx,
      dayNum: dayIdx + 1, totalDays,
      moonAge: Math.round(moonAge * 10) / 10,
      progress,
      fillWidth,
    };
    this._c.phase.set(key, v);
    return v;
  },

  /* ---------- 黄历 ---------- */

  buildAlmanac(solar, hour, minute) {
    const key = `${this._dayKey(solar)}-${hour}`;
    let v = this._c.almanac.get(key);
    if (v) return v;

    const { lunar } = this.getLunarAndCycle(solar);
    const solarTime = SolarTime.fromYmdHms(solar.getYear(), solar.getMonth(), solar.getDay(), hour, minute, 0);
    const lunarHour = solarTime.getLunarHour();
    const yearSC = nameOf(safe(() => solar.getSixtyCycleDay().getYear(), null));
    const monthSC = nameOf(safe(() => solar.getSixtyCycleDay().getMonth(), null));
    const dayPillar = nameOf(safe(() => solar.getSixtyCycleDay().getSixtyCycle(), null));
    const zodiac = safe(() => { const eb = SixtyCycle.fromName(yearSC).getEarthBranch(); return nameOf(eb.getZodiac()); }, '');
    const recommends = safe(() => solar.getSixtyCycleDay().getRecommends(), []) || [];
    const avoids = safe(() => solar.getSixtyCycleDay().getAvoids(), []) || [];
    const sound = safe(() => { const sc = solar.getSixtyCycleDay().getSixtyCycle(); return nameOf(sc.getSound()); }, '');
    const dayBranch = safe(() => { const sc = solar.getSixtyCycleDay().getSixtyCycle(); return nameOf(sc.getEarthBranch()); }, '');
    const clash = BRANCH_OPPOSITE[dayBranch] ? `冲${BRANCH_OPPOSITE[dayBranch]}` : '';
    const sha = BRANCH_SHA[dayBranch] ? `煞${BRANCH_SHA[dayBranch]}` : '';
    const dutyGod = safe(() => nameOf(lunar.getTwelveStar()), '');
    const hours = safe(() => lunar.getHours(), []) || [];
    const nowH = new Date().getHours();
    const isSelToday = isSameDay(solar, SolarDay.fromYmd(getToday().year, getToday().month, getToday().day));
    const nowIdx = Math.floor(((nowH + 1) % 24) / 2);
    const hourList = hours.slice(0, 12).map((h, i) => {
      const gz = safe(() => nameOf(h.getSixtyCycle()), '');
      const ts = safe(() => h.getTwelveStar(), null);
      const ecl = ts ? nameOf(safe(() => ts.getEcliptic(), '')) : '';
      const isGood = ecl === '黄道';
      return { branch: gz[1] || '—', stem: gz[0] || '—', isGood, luck: ecl ? (isGood ? '吉' : '凶') : '', isNow: isSelToday && i === nowIdx };
    });
    const duty = safe(() => nameOf(lunar.getDuty()), '');
    const gods = safe(() => solar.getSixtyCycleDay().getGods(), []) || [];
    const godsTxt = gods.slice(0, 6).map(x => nameOf(x)).join(' ') || '无';
    const fetus = safe(() => nameOf(lunar.getFetusDay()), '');
    const star28 = safe(() => nameOf(lunar.getTwentyEightStar()), '');
    const stem = (dayPillar && dayPillar[0]) || '';
    const branch = (dayPillar && dayPillar[1]) || '';
    const pengzuStem = PENGZU_STEM[stem] || '';
    const pengzuBranch = PENGZU_BRANCH[branch] || '';

    v = {
      yearSC, monthSC, dayPillar, zodiac, recommends, avoids,
      sound, clash, sha, dutyGod, hourList,
      duty, godsTxt, fetus, star28,
      pengzuStem, pengzuBranch,
      weekCn: getWeekCn(solar),
    };
    this._c.almanac.set(key, v);
    return v;
  },
};

      const eb = SixtyCycle.fromName(yearSC).getEarthBranch();

    const daySC = safe(() => nameOf(solar.getSixtyCycleDay().getSixtyCycle(), null), '');

  renderTerm(solar) {

        <div class="term-bar">

  renderMoon(solar, lunar) {

    const trackFillWidth = phase.fillWidth;

      let cls;
      if (i === phase.phaseIdx) cls = 'active';
      else if (i < phase.phaseIdx) cls = 'past';
      else cls = 'future';

      return `
        <div class="moon-node ${cls}" title="${esc(p.name)}">
          <div class="icon">${p.emoji}</div>
          <div class="label">${p.short}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="card moon-card">
        <div class="section-title"><div class="bar purple"></div>月相</div>

        <div class="moon-wrap">
          <div class="moon-visual"><span class="moon-emoji">${phase.emoji}</span></div>
          <div class="moon-info">
            <div class="moon-name">${esc(phase.name)}</div>
            <div class="moon-idx">

        <div class="moon-track">
          <div class="moon-track-fill" style="width:${trackFillWidth}%"></div>

  renderFestivals(solar, state) {

        <div class="card festival-card">
          <div class="section-title">
            <div class="bar red"></div>节日

          </div>
          ${rangeBar}
          <div class="fest-empty">未来 ${esc(rangeOpt.label)} 内暂无节日</div>

  renderFestRow(f) {

  renderCalendar(state) {

      Model.buildDay(s, year, month, year, month, day)

    return `
      <div class="card calendar-card">
        <div class="cal-header">
          <div class="cal-title">

            <button data-nav="1" aria-label="下个月" title="下一个月">›</button>
            <button class="year-btn" data-nav="year-next" aria-label="下一年" title="下一年">»</button>
          </div>
        </div>
        <div class="cal-dow-row">

        </div>

      </div>

  renderCell(cell) {
    const classes = ['cal-cell'];
    if (!cell.isCurrentMonth) classes.push('other-month');
    if (cell.isWeekend && cell.isCurrentMonth) classes.push('weekend');
    if (cell.isSelected) classes.push('selected');
    if (cell.isToday) classes.push('today');

    let badge = '';
    if (cell.holiday) badge = cell.holiday.isWork ? `<span class="badge work">班</span>` : `<span class="badge">休</span>`;
    const moonDot = cell.isMoonDay ? `<span class="moon-dot moon-${cell.moonIndex}"></span>` : '';
    const labelCls = cell.labelType === 'term' ? 'term' : cell.labelType === 'festival' ? 'festival' : '';
    const s = cell.solar;
    return `
      <div class="${classes.join(' ')}" data-y="${s.getYear()}" data-m="${s.getMonth()}" data-d="${s.getDay()}">
        ${badge}
        <div class="day-num">${cell.dayNum}</div>
        <div class="day-label ${labelCls}">${esc(cell.label)}</div>
        ${moonDot}
      </div>
    `;

  renderAlmanac(state) {
    const { year, month, day, hour, minute } = state;
    const solar = SolarDay.fromYmd(year, month, day);
    const al = Model.buildAlmanac(solar, hour, minute);
    const recTxt = al.recommends.length ? al.recommends.map(x => `<span class="tag">${esc(nameOf(x))}</span>`).join('') : '<span style="color:var(--text-light)">无</span>';
    const avoTxt = al.avoids.length ? al.avoids.map(x => `<span class="tag">${esc(nameOf(x))}</span>`).join('') : '<span style="color:var(--text-light)">无</span>';
    return `
      <div class="card almanac-card">
        <div class="yiji-list">
          <div class="yiji-row"><div class="yiji-icon y">宜</div><div class="yiji-body">${recTxt}</div></div>
          <div class="yiji-row"><div class="yiji-icon j">忌</div><div class="yiji-body">${avoTxt}</div></div>
        </div>
        <div class="triple-row">
          <div class="triple-cell"><div class="triple-key">纳音</div><div class="triple-val">${esc(al.sound)}</div></div>
          <div class="triple-cell"><div class="triple-key">冲煞</div><div class="triple-val red">${esc(al.clash)} ${esc(al.sha)}</div></div>
          <div class="triple-cell"><div class="triple-key">值神</div><div class="triple-val">${esc(al.dutyGod)}</div></div>
        </div>
        <div class="hours-section">
          <div class="hours-title">时辰吉凶</div>
          <div class="hours-scroll">
            <div class="hours-grid">
              ${al.hourList.map(h => `
                <div class="hour-cell ${h.isNow ? 'now' : ''}">
                  <div class="hz">${esc(h.branch)}</div>
                  <div class="gz">${esc(h.stem)}</div>
                  <div class="jl ${h.isGood ? 'y' : 'n'}">${esc(h.luck)}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
        <div class="quad">
          <div class="quad-cell"><div class="quad-key">建除</div><div class="duty-big">${esc(al.duty)}</div></div>
          <div class="quad-cell"><div class="quad-key">吉神宜趋</div><div class="quad-val">${esc(al.godsTxt)}</div></div>
          <div class="quad-cell"><div class="quad-key">今日胎神</div><div class="quad-val">${esc(al.fetus)}</div></div>
          <div class="quad-cell"><div class="quad-key">二十八星宿</div><div class="quad-val">${esc(al.star28)}</div></div>
          <div class="pengzu">
            <span class="lbl">彭祖百忌</span>
            ${esc(al.pengzuStem)}${al.pengzuStem && al.pengzuBranch ? ' · ' : ''}${esc(al.pengzuBranch)}
          </div>
        </div>
      </div>
    `;
  },
};

/* ============================================================
 * 模块 5 · 应用层（分层渲染 + 单定时器）
   ============================================================ */
const App = {

  state: (() => {
    const t = getToday();
    return {
      year: t.year, month: t.month, day: t.day,
      hour: t.hour, minute: t.minute,
      festRange: DEFAULT_RANGE,
      festExpanded: false,
    };
  })(),

  root: null,
  _clockTimer: null,
  _heroEl: null,
  _lastDayKey: '',

  init() {
    this.root = document.getElementById('app');
    this._lastDayKey = new Date().toDateString();
    this.render();
    this.bindEvents();
    this._startClock();
  },

  /* ---- 全量渲染：初始化 / 翻月 / 翻年 / 跨天 / 点击日期 ---- */
  render() {
    this.root.innerHTML = View.render(this.state);
    this._heroEl = null;
  },

  /* ---- 局部渲染：仅重建「节日卡」---- */
  _renderFestivalsOnly() {
    const old = this.root.querySelector('.festival-card');
    if (!old) return;
    const solar = SolarDay.fromYmd(this.state.year, this.state.month, this.state.day);
    old.outerHTML = View.renderFestivals(solar, this.state);
  },

  navigate(delta) {
    if (delta === 'today') {
      const t = getToday();
      Object.assign(this.state, { year: t.year, month: t.month, day: t.day, hour: t.hour, minute: t.minute });
    } else if (delta === 'year-prev') {
      this.state.year -= 1;
    } else if (delta === 'year-next') {
      this.state.year += 1;
    } else {
      let m = this.state.month + delta;
      let y = this.state.year;
      if (m < 1)  { m = 12; y--; }
      if (m > 12) { m = 1;  y++; }
      this.state.year = y;
      this.state.month = m;
    }

    const maxDay = SolarMonth.fromYm(this.state.year, this.state.month).getDayCount();
    if (this.state.day > maxDay) this.state.day = maxDay;

    this.state.festExpanded = false;
    this.render();
  },

  bindEvents() {
    this.root.addEventListener('click', (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        const v = navBtn.dataset.nav;
        if (v === 'today') this.navigate('today');
        else if (v === 'year-prev') this.navigate('year-prev');
        else if (v === 'year-next') this.navigate('year-next');
        else this.navigate(+v);
        return;
      }

      const rangeBtn = e.target.closest('[data-fest-range]');
      if (rangeBtn) {
        this.state.festRange = rangeBtn.dataset.festRange;
        this.state.festExpanded = false;
        this._renderFestivalsOnly();
        return;
      }

      const toggle = e.target.closest('[data-fest-toggle]');
      if (toggle) {
        this.state.festExpanded = !this.state.festExpanded;
        this._renderFestivalsOnly();
        return;
      }

      const cell = e.target.closest('.cal-cell');
      if (cell && cell.dataset.y) {
        const y = +cell.dataset.y;
        const m = +cell.dataset.m;
        const d = +cell.dataset.d;
        this.state.year = y;
        this.state.month = m;
        this.state.day = d;
        this.state.festExpanded = false;
        this.render();
      }
    });
  },

  /* ============================================================
   * 单定时器：setTimeout 自调度，对齐分钟边界
   * ============================================================ */
  _startClock() {
    const tick = () => {
      const now = new Date();

      if (!this._heroEl || !this._heroEl.isConnected) {
        this._heroEl = this.root.querySelector('#heroTime');
      }
      if (this._heroEl) {
        const next = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        if (this._heroEl.textContent !== next) this._heroEl.textContent = next;
      }

      const dayKey = now.toDateString();
      if (dayKey !== this._lastDayKey) {
        this._lastDayKey = dayKey;
        const t = getToday();
        Object.assign(this.state, { year: t.year, month: t.month, day: t.day, hour: t.hour, minute: t.minute });
        this.render();
      }

      const delay = 60_000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20;
      this._clockTimer = setTimeout(tick, delay);
    };

    tick();
  },
};

/* ============================================================
 * 模块 6 · 启动
   ============================================================ */
App.init();
</script>
