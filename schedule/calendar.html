<title>吉度日历</title>
<style>
:root {
  --bg: #eef0f3;
  --card: #ffffff;
  --text: #1a1d24;
  --text-sub: #7a8290;
  --text-light: #b8bec7;
  --red: #d94a4a;
  --red-soft: #fdf0f0;
  --orange: #e08a3a;
  --orange-soft: #fef5ea;
  --blue: #5b72c9;
  --blue-soft: #eef1fb;
  --blue-grad: linear-gradient(135deg, #6176cc 0%, #4f66c2 100%);
  --green: #2d9666;
  --green-soft: #eaf6f0;
  --purple: #7c5ec9;
  --gold: #c9a961;
  --line: #f0f1f3;
  --line-dark: #e6e8eb;
  --shadow: 0 1px 2px rgba(15,20,30,.03), 0 12px 32px rgba(15,20,30,.06);
  --shadow-cell: 0 8px 20px rgba(79,102,194,.28);
  --radius-card: 20px;
  --radius-cell: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  min-height: 100vh;
}

#app { width: 100%; container-type: inline-size; }

/* ============================================================
   页面布局（默认单列）
   ============================================================ */
.page {
  max-width: 1220px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.col-left, .col-right { display: contents; }
.card { background: var(--card); border-radius: var(--radius-card); box-shadow: var(--shadow); overflow: hidden; width: 100%; }
.page > .card { width: 100%; min-width: 0; }

/* 卡片排序 */
.hero-card     { order: 1; }
.calendar-card { order: 2; }
.term-card     { order: 3; }
.moon-card     { order: 4; }
.festival-card { order: 5; }
.almanac-card  { order: 6; }
.hour-card     { order: 7; }

.section-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a5160; font-weight: 600; letter-spacing: .5px; margin-bottom: 16px; }
.section-title .bar { width: 3px; height: 14px; border-radius: 2px; }
.section-title .bar.orange { background: var(--orange); }
.section-title .bar.purple { background: linear-gradient(180deg, var(--purple), var(--blue)); }
.section-title .bar.red    { background: linear-gradient(180deg, var(--red), var(--orange)); }
.section-title .count { margin-left: auto; font-size: 11px; color: var(--text-light); background: #f4f5f7; padding: 2px 8px; border-radius: 10px; font-weight: 500; letter-spacing: 0; }

/* 容器宽 ≥ 640px 时 → 两列 */
@container (min-width: 640px) {
  .page {
    display: grid;
    grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
    gap: 12px;
    align-items: start;
  }
  .col-left, .col-right {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    container-type: inline-size;
  }
}

/* ============================================================
   模块 1 · 大时间卡
   ============================================================ */
.hero-card { padding: 36px 24px 24px; background: #ffffff; text-align: center; position: relative; }
.hero-time { font-size: 68px; font-weight: 700; line-height: 1; letter-spacing: -4px; color: #1a1d24; font-variant-numeric: tabular-nums; margin-bottom: 22px; }
.hero-date-line { font-size: 13.5px; font-weight: 700; color: var(--red); letter-spacing: .3px; line-height: 1.6; font-variant-numeric: tabular-nums; margin-bottom: 6px; word-break: break-word; }
.hero-lunar-line { font-size: 13.5px; font-weight: 700; color: var(--red); letter-spacing: .3px; line-height: 1.6; font-variant-numeric: tabular-nums; word-break: break-word; margin-bottom: 20px; }

.year-progress { text-align: left; padding-top: 16px; border-top: 1px dashed var(--line-dark); }
.year-progress-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; gap: 10px; min-height: 18px; }
.year-progress-head .yp-label { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; letter-spacing: .2px; white-space: nowrap; min-width: 0; }
.year-progress-head .yp-dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: linear-gradient(135deg, var(--blue), var(--purple)); }
.year-progress-head .yp-days { font-size: 12px; font-weight: 500; color: var(--text-sub); font-variant-numeric: tabular-nums; letter-spacing: .1px; }
.year-progress-head .yp-days .cur { font-size: 14px; font-weight: 700; color: #303640; letter-spacing: -.2px; }
.year-progress-head .yp-days .sep,
.year-progress-head .yp-days .total,
.year-progress-head .yp-days .unit { color: var(--text-light); font-weight: 500; }
.year-progress-head .yp-left { font-size: 11px; font-weight: 500; color: var(--text-light); font-variant-numeric: tabular-nums; letter-spacing: .2px; white-space: nowrap; }

.year-progress-bar-wrap { position: relative; padding-top: 18px; }
.year-progress-percent { position: absolute; top: 0; left: 0; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--blue); font-variant-numeric: tabular-nums; letter-spacing: -.2px; line-height: 1.1; white-space: nowrap; transition: left .3s ease; z-index: 3; }
.year-progress-percent.edge-left { transform: translateX(0); }
.year-progress-percent.edge-right { transform: translateX(0); left: auto !important; right: 0; }
.year-progress-bar { position: relative; height: 8px; border-radius: 4px; background: #f0f2f5; overflow: hidden; }
.year-progress-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: linear-gradient(90deg, #8596d9 0%, #5b72c9 45%, #7c5ec9 100%); transition: width .3s ease; }
.year-progress-quarter { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.75); }
.year-progress-quarter.q1 { left: 24.66%; }
.year-progress-quarter.q2 { left: 49.59%; }
.year-progress-quarter.q3 { left: 74.79%; }
.year-progress-marker { position: absolute; top: 22px; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2.5px solid var(--blue); box-shadow: 0 1px 3px rgba(91,114,201,.35); transition: left .3s ease; z-index: 2; pointer-events: none; }
.year-progress-footer { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin-top: 6px; font-size: 10px; color: var(--text-light); letter-spacing: .2px; font-variant-numeric: tabular-nums; }

/* ============================================================
   模块 2 · 节气卡
   ============================================================ */
.term-card { padding: 18px 22px 18px; }
.term-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.term-head-title { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4a5160; font-weight: 600; letter-spacing: .5px; }
.term-head-title .bar { width: 3px; height: 14px; border-radius: 2px; background: var(--orange); }
.term-season-tag { font-size: 11px; color: var(--orange); background: var(--orange-soft); padding: 2px 10px; border-radius: 10px; font-weight: 600; letter-spacing: .5px; display: inline-flex; align-items: center; gap: 4px; }
.term-season-tag::before { content: ''; width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.term-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.term-name { font-size: 19px; font-weight: 700; color: var(--text); letter-spacing: .5px; line-height: 1.2; }
.term-name.next { color: var(--orange); }
.term-date { font-size: 13px; color: var(--text-sub); font-variant-numeric: tabular-nums; white-space: nowrap; }
.term-bar { position: relative; height: 6px; border-radius: 3px; background: #f0f2f5; margin: 12px 0 10px; }
.term-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #f0b866, var(--orange)); }
.term-bar-dot { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 3px solid var(--orange); box-shadow: 0 1px 4px rgba(224,138,58,.35); }
.term-tip { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-bottom: 14px; }
.term-tip .hl { color: var(--orange); font-weight: 600; }
.term-hou { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line-dark); font-size: 12.5px; line-height: 1.4; }
.hou-title { font-size: 11px; color: var(--orange); background: var(--orange-soft); padding: 2px 8px; border-radius: 6px; font-weight: 700; letter-spacing: 1px; flex: 0 0 auto; }
.hou-name { color: var(--text); font-weight: 600; flex: 1; letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hou-progress { color: var(--text-sub); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 12px; flex: 0 0 auto; }
.hou-progress .hou-num { color: var(--orange); font-weight: 600; }

/* ============================================================
   模块 3 · 月相卡
   ============================================================ */
.moon-card { padding: 18px 22px 20px; }
.moon-wrap { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.moon-visual { flex: 0 0 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 46px; line-height: 1; position: relative; background: radial-gradient(circle at 72% 26%, rgba(140,105,220,.35), transparent 55%), radial-gradient(circle at 26% 74%, rgba(220,180,80,.30), transparent 55%), radial-gradient(circle at 40% 40%, #26213a 0%, #16131f 70%); box-shadow: inset -6px -6px 18px rgba(0,0,0,.55), inset 4px 4px 12px rgba(140,105,220,.14), 0 6px 18px rgba(20,15,40,.28); overflow: hidden; }
.moon-visual::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.10), transparent 45%); pointer-events: none; }
.moon-visual .moon-emoji { position: relative; z-index: 1; filter: drop-shadow(0 0 8px rgba(220,180,80,.35)); }
.moon-info { flex: 1; min-width: 0; }
.moon-name { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: .5px; line-height: 1.2; }
.moon-idx { font-size: 12.5px; color: var(--text-sub); margin-top: 4px; font-variant-numeric: tabular-nums; }
.moon-idx .age-num { color: var(--blue); font-weight: 600; }
.moon-track { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); align-items: end; padding-top: 6px; }
.moon-track::before { content: ''; position: absolute; left: 6.25%; right: 6.25%; top: 20px; height: 2px; background: #eef1f5; border-radius: 1px; z-index: 0; }
.moon-track-fill { position: absolute; left: 6.25%; top: 20px; height: 2px; background: linear-gradient(90deg, #8596d9, #5b72c9 40%, #7c5ec9); border-radius: 1px; z-index: 1; transition: width .3s ease; }
.moon-node { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: opacity .25s ease; }
.moon-node.past { opacity: 1; }
.moon-node.future { opacity: .35; }
.moon-node.active { opacity: 1; }
.moon-node .icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; background: #fff; box-shadow: 0 0 0 3px #fff; transition: all .25s ease; }
.moon-node .label { font-size: 10px; color: var(--text-light); letter-spacing: 0; white-space: nowrap; transition: color .2s ease, font-weight .2s ease; }
.moon-node.active .icon { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 5px rgba(91,114,201,.22); }
.moon-node.active .label { color: var(--blue); font-weight: 700; }

/* ============================================================
   模块 4 · 节日卡
   ============================================================ */
.festival-card { padding: 18px 22px 12px; }
.fest-range { display: flex; gap: 6px; margin-bottom: 14px; background: #f4f5f7; padding: 3px; border-radius: 10px; }
.fest-range button { flex: 1; border: none; background: transparent; color: var(--text-sub); font-size: 12px; font-weight: 500; padding: 6px 8px; border-radius: 8px; cursor: pointer; transition: all .15s ease; font-family: inherit; }
.fest-range button:hover { color: var(--text); }
.fest-range button.active { background: #ffffff; color: var(--red); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.fest-list { position: relative; }
.fest-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.fest-row + .fest-row { border-top: 1px dashed var(--line); }
.fest-icon { flex: 0 0 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
.fest-icon.tone-cake   { background: linear-gradient(135deg, #fef4d2 0%, #fde1a3 100%); }
.fest-icon.tone-red    { background: linear-gradient(135deg, #fde5e4 0%, #fbd2d0 100%); }
.fest-icon.tone-pink   { background: linear-gradient(135deg, #fce7f3 0%, #f7d3e8 100%); }
.fest-icon.tone-gold   { background: linear-gradient(135deg, #fdeacc 0%, #fbd9a3 100%); }
.fest-icon.tone-green  { background: linear-gradient(135deg, #e3f6ec 0%, #c9ecd9 100%); }
.fest-icon.tone-blue   { background: linear-gradient(135deg, #e3ecfb 0%, #c8dbf5 100%); }
.fest-icon.tone-purple { background: linear-gradient(135deg, #ede4fb 0%, #ddc9f5 100%); }
.fest-info { flex: 1; min-width: 0; }
.fest-name { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: .2px; line-height: 1.25; display: flex; align-items: center; gap: 6px; }
.fest-tag { font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 500; letter-spacing: .3px; white-space: nowrap; }
.fest-tag.legal { background: var(--red-soft); color: var(--red); }
.fest-tag.lunar { background: var(--orange-soft); color: var(--orange); }
.fest-tag.solar { background: var(--blue-soft); color: var(--blue); }
.fest-sub { font-size: 12px; color: var(--text-sub); margin-top: 3px; font-variant-numeric: tabular-nums; }
.fest-days { font-size: 16px; font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -.2px; }
.fest-days.today { font-size: 13px; color: #fff; background: var(--red); padding: 3px 10px; border-radius: 12px; letter-spacing: 0; }
.fest-days.ongoing { font-size: 13px; color: #fff; background: var(--green); padding: 3px 10px; border-radius: 12px; letter-spacing: 0; }
.fest-toggle { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; padding: 10px 0 4px; border-top: 1px dashed var(--line); color: var(--blue); font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none; transition: opacity .15s ease; }
.fest-toggle:hover { opacity: .75; }
.fest-toggle .chev { display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transition: transform .2s ease; }
.fest-toggle.expanded .chev { transform: rotate(180deg); }
.fest-scroll { max-height: 360px; overflow-y: auto; scrollbar-width: thin; margin: 0 -22px; padding: 0 22px; }
.fest-scroll::-webkit-scrollbar { width: 4px; }
.fest-scroll::-webkit-scrollbar-thumb { background: #e3e6ea; border-radius: 2px; }
.fest-scroll::-webkit-scrollbar-track { background: transparent; }
.fest-empty { text-align: center; padding: 30px 0 20px; color: var(--text-light); font-size: 13px; }

/* ============================================================
   模块 5 · 日历卡
   ============================================================ */
.calendar-card { padding: 22px 20px 18px; }
.cal-header { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 18px; gap: 10px; }
.cal-title { font-size: 21px; font-weight: 700; letter-spacing: .2px; color: var(--text); display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cal-title .year { font-size: 14px; font-weight: 500; color: var(--text-sub); }
.cal-title .month-num { font-size: 21px; font-weight: 700; color: var(--text); }
.cal-nav { display: flex; gap: 3px; align-items: center; }
.cal-nav button { min-width: 32px; height: 32px; border: none; background: transparent; color: var(--text-sub); font-size: 15px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 9px; transition: background .15s ease, color .15s ease, transform .1s ease; font-family: inherit; padding: 0; user-select: none; }
.cal-nav button:hover { background: #f4f5f7; color: var(--text); }
.cal-nav button:active { transform: scale(.92); }
.cal-nav button.year-btn { font-size: 16px; font-weight: 400; color: var(--text-light); letter-spacing: -1px; }
.cal-nav button.year-btn:hover { color: var(--blue); background: var(--blue-soft); }
.cal-nav button.today-btn { min-width: auto; padding: 0 12px; font-size: 12.5px; font-weight: 600; color: var(--red); background: var(--red-soft); }
.cal-nav button.today-btn:hover { background: #fbe3e3; }
.cal-dow-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); padding-bottom: 6px; }
.cal-dow { text-align: center; font-size: 13px; font-weight: 500; color: var(--text-sub); padding: 6px 0 10px; letter-spacing: .5px; }
.cal-dow.weekend { color: var(--red); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal-cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 2px; min-height: 74px; border-radius: var(--radius-cell); cursor: pointer; transition: background .12s ease, box-shadow .15s ease; user-select: none; contain: layout style; min-width: 0; }
.cal-cell:hover { background: #f7f8fa; }
.cal-cell.other-month { opacity: .28; pointer-events: none; }
.cal-cell .day-num { font-size: 19px; font-weight: 600; line-height: 1.1; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
.cal-cell.weekend .day-num { color: var(--red); }
.cal-cell .day-label { font-size: 10.5px; line-height: 1.2; margin-top: 6px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 6px); text-align: center; letter-spacing: .1px; }
.cal-cell .day-label.term { color: var(--orange); font-weight: 500; }
.cal-cell .day-label.festival { color: var(--red); font-weight: 500; }
.cal-cell.selected:not(.today) { background: linear-gradient(135deg, #f1f4fc 0%, #e8edf9 100%); box-shadow: inset 0 0 0 1.5px rgba(91, 114, 201, .45), 0 2px 6px rgba(91, 114, 201, .08); }
.cal-cell.selected:not(.today):hover { background: linear-gradient(135deg, #eaeefa 0%, #dee5f6 100%); }
.cal-cell.selected:not(.today) .day-num { color: var(--blue); font-weight: 700; }
.cal-cell.selected:not(.today) .day-label { color: var(--blue); font-weight: 500; }
.cal-cell.selected:not(.today) .day-label.term { color: var(--orange); }
.cal-cell.selected:not(.today) .day-label.festival { color: var(--red); }
.cal-cell.today { background: var(--blue-grad); box-shadow: var(--shadow-cell); }
.cal-cell.today:hover { background: var(--blue-grad); }
.cal-cell.today .day-num { color: #ffffff; }
.cal-cell.today .day-label { color: rgba(255, 255, 255, .9); }
.cal-cell.today .day-label.term, .cal-cell.today .day-label.festival { color: #ffe4e4; }
.cal-cell .badge { position: absolute; top: 4px; right: 4px; font-size: 9.5px; line-height: 15px; min-width: 15px; padding: 0 4px; border-radius: 5px; font-weight: 600; color: #ffffff; background: var(--red); letter-spacing: .2px; text-align: center; }
.cal-cell .badge.work { background: var(--text-sub); }
.cal-cell.today .badge { background: rgba(255, 255, 255, .3); color: #ffffff; }
.cal-cell.selected:not(.today) .badge { background: var(--red); }
.cal-cell .moon-dot { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 3.5px; height: 3.5px; border-radius: 50%; }
.cal-cell .moon-dot.moon-0 { background: #4a5568; }
.cal-cell .moon-dot.moon-1 { background: #6b8ec2; }
.cal-cell .moon-dot.moon-2 { background: #93b8dc; }
.cal-cell .moon-dot.moon-3 { background: #b8cfe8; }
.cal-cell .moon-dot.moon-4 { background: #d4b05c; }
.cal-cell .moon-dot.moon-5 { background: #d9b76b; }
.cal-cell .moon-dot.moon-6 { background: #b8945a; }
.cal-cell .moon-dot.moon-7 { background: #8b7355; }
.cal-cell.today .moon-dot { background: rgba(255, 255, 255, .8) !important; }

/* ============================================================
   模块 6 · 黄历详情卡（4×3 网格）
   ============================================================ */
.almanac-card { padding: 20px 22px 20px; }

.yiji-list { padding: 0 0 18px; border-bottom: 1px dashed var(--line-dark); }
.yiji-row { display: flex; gap: 12px; padding: 6px 0; align-items: flex-start; }
.yiji-row + .yiji-row { padding-top: 12px; }
.yiji-icon { flex: 0 0 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; margin-top: 1px; }
.yiji-icon.y { background: linear-gradient(135deg, #3eb87a, var(--green)); }
.yiji-icon.j { background: linear-gradient(135deg, #e05858, var(--red)); }
.yiji-body { flex: 1; font-size: 13.5px; color: #303640; line-height: 1.9; }
.yiji-body .tag { display: inline-block; margin-right: 10px; white-space: nowrap; }

.day-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 18px;
}
.day-cell {
  background: #fff;
  padding: 12px 8px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 6px;
  min-width: 0;
}
.day-key {
  font-size: 11.5px;
  color: var(--text-light);
  letter-spacing: .5px;
  line-height: 1.2;
}
.day-val {
  font-size: 13px;
  color: #303640;
  font-weight: 500;
  line-height: 1.5;
  word-break: break-word;
  max-width: 100%;
}
.day-val.red { color: var(--red); }
.day-val .emph { color: var(--red); font-weight: 600; }
.day-val .dim { color: var(--text-sub); }

/* 彭祖百忌单元格：桌面默认两句各占一行 */
.day-cell.pengzu-cell { text-align: left; }
.day-cell.pengzu-cell .day-val {
  font-size: 12px;
  line-height: 1.6;
  text-align: left;
}
.pengzu-val {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.pengzu-val > div {
  white-space: nowrap;
}

.hour-strip {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  margin-top: 12px;
}
.hour-chip {
  background: #fff;
  padding: 10px 2px;
  text-align: center;
  cursor: pointer;
  user-select: none;
  transition: background .15s ease;
  min-width: 0;
  position: relative;
}
.hour-chip:hover { background: #f7f8fa; }
.hour-chip .hz { font-size: 13px; font-weight: 600; color: var(--text); }
.hour-chip .gz { font-size: 10.5px; color: var(--text-light); margin: 3px 0; line-height: 1.2; }
.hour-chip .jl { font-size: 11px; font-weight: 700; }
.hour-chip .jl.y { color: var(--green); }
.hour-chip .jl.n { color: var(--red); }
.hour-chip.now { background: linear-gradient(180deg, #eef3fc, #f6f9ff); }
.hour-chip.now::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--blue); }
.hour-chip.selected { background: linear-gradient(180deg, #e9eefb, #f2f5fe); box-shadow: inset 0 0 0 2px rgba(91,114,201,.5); }

/* ============================================================
   模块 7 · 时辰详情卡
   ============================================================ */
.hour-card { padding: 22px 22px 20px; }
.hour-card-head { text-align: center; margin-bottom: 18px; }
.hour-card-title { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: .5px; }
.hour-card-title .luck-x { color: var(--red); }
.hour-card-title .luck-j { color: var(--green); }
.hour-card-time { font-size: 13px; color: var(--text-sub); margin-top: 6px; font-variant-numeric: tabular-nums; }

.hour-detail-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.hour-detail-cell {
  background: #faf6ee;
  border-radius: 10px;
  padding: 12px 6px;
  text-align: center;
  min-width: 0;
}
.hour-detail-key { font-size: 12px; color: #4a5160; margin-bottom: 8px; line-height: 1.3; }
.hour-detail-val { font-size: 13px; color: var(--text-sub); font-weight: 500; line-height: 1.4; word-break: break-word; }

/* 加载 / 错误 */
.loading { text-align: center; padding: 120px 20px; color: var(--text-sub); font-size: 13px; }
.spinner { width: 26px; height: 26px; border: 3px solid #e3e6ea; border-top-color: var(--blue); border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { padding: 14px 18px; background: #fef2f2; color: #b91c1c; border-radius: 12px; font-size: 13px; text-align: center; max-width: 500px; margin: 40px auto; }

/* ============================================================
   响应式尺寸微调
   ============================================================ */
@container (max-width: 560px) {
  .page { padding: 12px 10px 30px; }
  .hero-card { padding: 28px 18px 20px; }
  .hero-time { font-size: 56px; letter-spacing: -3px; margin-bottom: 18px; }
  .hero-date-line { font-size: 12.5px; letter-spacing: .2px; }
  .hero-lunar-line {
    font-size: clamp(10px, 3.4vw, 12.5px);
    white-space: nowrap;
    word-break: keep-all;
    letter-spacing: 0;
    margin-bottom: 16px;
  }

  .year-progress { padding-top: 14px; }
  .year-progress-head { min-height: 16px; margin-bottom: 2px; }
  .year-progress-head .yp-label { gap: 5px; font-size: 11px; }
  .year-progress-head .yp-days { font-size: 11.5px; }
  .year-progress-head .yp-days .cur { font-size: 13px; }
  .year-progress-head .yp-left { font-size: 10.5px; }
  .year-progress-bar-wrap { padding-top: 16px; }
  .year-progress-percent { font-size: 11.5px; }
  .year-progress-marker { top: 20px; width: 11px; height: 11px; border-width: 2px; }
  .year-progress-footer { font-size: 9.5px; margin-top: 5px; }

  .term-card { padding: 16px 18px; }
  .term-head { margin-bottom: 14px; }
  .term-season-tag { font-size: 10.5px; padding: 2px 8px; }
  .term-name { font-size: 17px; }
  .term-name.next { font-size: 16px; }
  .term-hou { font-size: 12px; padding-top: 12px; margin-top: 12px; gap: 8px; }
  .hou-title { font-size: 10.5px; padding: 1px 7px; }
  .hou-progress { font-size: 11.5px; }

  .moon-card { padding: 16px 18px; }
  .moon-visual { flex: 0 0 68px; height: 68px; font-size: 40px; }
  .moon-name { font-size: 18px; }
  .moon-idx { font-size: 12px; }
  .moon-node .icon { width: 24px; height: 24px; font-size: 15px; }
  .moon-node .label { font-size: 9px; }
  .moon-track::before { top: 18px; }
  .moon-track-fill { top: 18px; }
  .moon-node.active .icon { transform: scale(1.12); }

  .festival-card { padding: 16px 18px 10px; }
  .fest-icon { flex: 0 0 36px; height: 36px; font-size: 18px; border-radius: 10px; }
  .fest-name { font-size: 14px; }
  .fest-days { font-size: 15px; }
  .fest-scroll { margin: 0 -18px; padding: 0 18px; }

  .calendar-card { padding: 16px 10px 12px; }
  .cal-header { padding-bottom: 12px; gap: 6px; }
  .cal-title { font-size: 17px; gap: 4px; }
  .cal-title .year { font-size: 12.5px; }
  .cal-title .month-num { font-size: 17px; }
  .cal-nav { gap: 1px; }
  .cal-nav button { min-width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
  .cal-nav button.year-btn { font-size: 14px; }
  .cal-nav button.today-btn { padding: 0 9px; font-size: 11.5px; }
  .cal-dow { font-size: 12px; padding: 4px 0 8px; }
  .cal-cell { min-height: 66px; padding: 8px 1px; border-radius: 10px; }
  .cal-cell .day-num { font-size: 16.5px; }
  .cal-cell .day-label { font-size: 9.5px; margin-top: 5px; }

  .almanac-card { padding: 20px 14px; }
  .yiji-body { font-size: 12.5px; }
  .yiji-body .tag { margin-right: 8px; }

  /* ---------- 手机端日级别网格重排 ---------- */
  .day-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    margin-top: 14px;
  }
  .day-cell { padding: 10px 4px; gap: 4px; }
  .day-key { font-size: 10.5px; letter-spacing: .3px; }
  .day-val { font-size: 11.5px; line-height: 1.4; }

  /* 重排顺序：
     1) 喜神/财神/福神/贵神 相邻
     2) 五行、廿八宿移到胎神上方
     3) 彭祖百忌 跨两列放到最后（紧邻 12 时辰前）
     —— 使用 order 属性，不改变 DOM 结构 */
  .day-cell:nth-child(1)  { order: 1; }                       /* 黑道 */
  .day-cell:nth-child(2)  { order: 2; }                       /* 十二神 */
  .day-cell:nth-child(3)  { order: 3; }                       /* 幸运生肖 */
  .day-cell:nth-child(4)  { order: 4; }                       /* 冲煞 */
  .day-cell:nth-child(8)  { order: 5; }                       /* 五行 */
  .day-cell:nth-child(12) { order: 6; }                       /* 廿八宿 */
  .day-cell:nth-child(5)  { order: 7; grid-column: 1 / -1; }  /* 胎神（跨两列） */
  .day-cell:nth-child(6)  { order: 8; }                       /* 喜神 */
  .day-cell:nth-child(7)  { order: 9; }                       /* 财神 */
  .day-cell:nth-child(10) { order: 10; }                      /* 福神 */
  .day-cell:nth-child(11) { order: 11; }                      /* 贵神 */
  .day-cell:nth-child(9)  { order: 12; grid-column: 1 / -1; } /* 彭祖百忌（跨两列，最后一行） */

  /* 手机端彭祖百忌：两句合到一行 */
  .day-cell.pengzu-cell { text-align: center; }
  .day-cell.pengzu-cell .day-val {
    font-size: 11px;
    line-height: 1.5;
    text-align: center;
  }
  .pengzu-val {
    flex-direction: row;
    flex-wrap: nowrap;
    gap: 0;
    justify-content: center;
    align-items: center;
  }
  .pengzu-val > div {
    font-size: 11px;
    white-space: nowrap;
  }
  /* 两句之间的分隔符 */
  .pengzu-val > div + div::before {
    content: ' · ';
    color: var(--text-sub);
    margin: 0 2px;
  }

  /* ---------- 12 时辰：一行显示，不够则横向滚动 ---------- */
  .hour-strip {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    gap: 1px;
    margin-top: 10px;
  }
  .hour-strip::-webkit-scrollbar { display: none; }
  .hour-chip { flex: 1 0 auto; min-width: 44px; padding: 8px 4px; }
  .hour-chip .hz { font-size: 12.5px; }
  .hour-chip .gz { font-size: 10px; margin: 2px 0; }
  .hour-chip .jl { font-size: 10.5px; }

  .hour-card { padding: 18px 14px; }
  .hour-card-title { font-size: 19px; }

  },

  _MAX: 1500,

  _prune() {
    if (this._c.lunar.size > this._MAX) {
      for (const k in this._c) this._c[k].clear();
    }
  },

  _dayKey(solar) {
    return `${solar.getYear()}-${solar.getMonth()}-${solar.getDay()}`;
  },

  getLunarAndCycle(solar) {
    const key = this._dayKey(solar);
    let v = this._c.lunar.get(key);
    if (v) return v;
    v = { lunar: solar.getLunarDay(), cycle: solar.getSixtyCycleDay() };
    this._c.lunar.set(key, v);
    this._prune();
    return v;
  },

  _getDayInfo(solar) {
    const key = this._dayKey(solar);
    let v = this._c.dayInfo.get(key);
    if (v) return v;
    const { lunar } = this.getLunarAndCycle(solar);
    v = {
      lunar,
      holiday: solar.getLegalHoliday(),
      solarFest: solar.getFestival(),
      lunarFest: lunar.getFestival(),
      term: solar.getTerm(),
      phaseDay: solar.getPhaseDay(),
    };
    this._c.dayInfo.set(key, v);
    return v;
  },

  buildGrid(year, month) {
    const key = `${year}-${month}`;
    let cells = this._c.grid.get(key);
    if (cells) return cells;

    const first = SolarDay.fromYmd(year, month, 1);
    const firstDow = first.getWeek().getIndex();
    const offset = (firstDow - WEEK_START + 7) % 7;
    const start = first.next(-offset);
    cells = new Array(42);
    for (let i = 0; i < 42; i++) cells[i] = start.next(i);
    this._c.grid.set(key, cells);
    return cells;
  },

  buildDay(solar, ctxYear, ctxMonth, selY, selM, selD) {
    const today = getToday();
    const info = this._getDayInfo(solar);
    const { lunar, holiday, solarFest, lunarFest, term, phaseDay } = info;
    const dow = solar.getWeek().getIndex();

    const isCurrentMonth = solar.getYear() === ctxYear && solar.getMonth() === ctxMonth;
    const isToday = solar.getYear() === today.year && solar.getMonth() === today.month && solar.getDay() === today.day;
    const isSelected = solar.getYear() === selY && solar.getMonth() === selM && solar.getDay() === selD;
    const isWeekend = dow === 0 || dow === 6;

    let isTermDay = false;
    if (term) {
      const td = term.getSolarDay();
      isTermDay = td.getYear() === solar.getYear() && td.getMonth() === solar.getMonth() && td.getDay() === solar.getDay();
    }

    let label = '', labelType = 'lunar';
    if (lunarFest) { label = lunarFest.getName(); labelType = 'festival'; }
    else if (solarFest) { label = solarFest.getName(); labelType = 'festival'; }
    else if (isTermDay) { label = term.getName(); labelType = 'term'; }
    else if (lunar.getDay() === 1) {
      const lm = lunar.getLunarMonth();
      label = lm.getName();
      if (lm.getMonthWithLeap() === 1) label = lm.getLunarYear().getSixtyCycle().getName() + '年' + label;
      labelType = 'month';
    } else {
      label = lunar.getName() + lunar.getSixtyCycle().getName();
    }

    const isMoonDay = phaseDay && phaseDay.getDayIndex() === 0;
    const moonIndex = isMoonDay ? phaseDay.getPhase().getIndex() : -1;

    return {
      solar, dayNum: solar.getDay(),
      isCurrentMonth, isToday, isSelected, isWeekend,
      label, labelType,
      holiday: holiday ? { isWork: holiday.isWork() } : null,
      isMoonDay, moonIndex,
    };
  },

  buildYearProgress(solar) {
    const key = this._dayKey(solar);
    let v = this._c.yearProgress.get(key);
    if (v) return v;

    const year = solar.getYear();
    const dayIdx = safe(() => solar.getIndexInYear(), 0);
    const totalDays = safe(() => SolarYear.fromYear(year).getDayCount(), 365);
    const dayNum = dayIdx + 1;
    const progress = totalDays > 0 ? Math.max(0, Math.min(100, (dayNum / totalDays) * 100)) : 0;

    let percentAlign = 'center';
    if (progress < 8)       percentAlign = 'left';
    else if (progress > 92) percentAlign = 'right';

    v = {
      year, dayNum, totalDays,
      daysLeft: Math.max(0, totalDays - dayNum),
      progress,
      percentText: progress.toFixed(1) + '%',
      percentAlign,
    };
    this._c.yearProgress.set(key, v);
    return v;
  },

  buildTermAround(solar) {
    const key = this._dayKey(solar);
    if (this._c.term.has(key)) return this._c.term.get(key);

    let prev = null;
    for (let i = 0; i <= 30; i++) {
      const d = solar.next(-i);
      const t = safe(() => d.getTerm(), null);
      if (t) { const td = safe(() => t.getSolarDay(), null); if (td && isSameDay(td, d)) { prev = { name: nameOf(t), solar: d }; break; } }
    }
    let next = null;
    for (let i = 1; i <= 30; i++) {
      const d = solar.next(i);
      const t = safe(() => d.getTerm(), null);
      if (t) { const td = safe(() => t.getSolarDay(), null); if (td && isSameDay(td, d)) { next = { name: nameOf(t), solar: d }; break; } }
    }
    if (!prev || !next) {
      this._c.term.set(key, null);
      return null;
    }

    const daysFromPrev = safe(() => solar.subtract(prev.solar), 0);
    const daysToNext   = safe(() => next.solar.subtract(solar), 0);
    const total = daysFromPrev + daysToNext;
    const progress = total > 0 ? (daysFromPrev / total) * 100 : 0;
    const fmtD = (d) => `${d.getMonth()}月${d.getDay()}日`;

    const lunar = safe(() => solar.getLunarDay(), null);
    const lunarMonth = lunar ? safe(() => lunar.getLunarMonth(), null) : null;
    const season = lunarMonth ? safe(() => lunarMonth.getSeason(), null) : null;
    const seasonName = season ? nameOf(season) : '';

    let houName = '';
    let houDayNum = 0;
    let houTotalDays = 5;
    const pd = safe(() => solar.getPhenologyDay(), null);
    if (pd) {
      const ph = safe(() => pd.getPhenology(), null);
      if (ph) houName = nameOf(ph);
      houDayNum = safe(() => pd.getDayIndex(), 0) + 1;
      const houStart = ph ? safe(() => ph.getSolarDay(), null) : null;
      const houNext = ph ? safe(() => ph.next(1), null) : null;
      const houNextStart = houNext ? safe(() => houNext.getSolarDay(), null) : null;
      if (houStart && houNextStart) {
        houTotalDays = Math.max(1, houNextStart.subtract(houStart));
      }
    }

    const v = {
      prevName: prev.name, prevDate: fmtD(prev.solar),
      nextName: next.name, nextDate: fmtD(next.solar),
      daysFromPrev, daysToNext,
      progress: Math.max(0, Math.min(100, progress)),
      seasonName, houName, houDayNum, houTotalDays,
    };
    this._c.term.set(key, v);
    return v;
  },

  buildFestivals(solar, maxDays) {
    const key = this._dayKey(solar);
    let all = this._c.festival.get(key);
    if (!all) {
      const map = new Map();
      for (const h of this._findHolidaysFromLegal(solar)) {
        if (!map.has(h.name)) map.set(h.name, h);
      }
      for (const f of this._findAllFestivals(solar, 400)) {
        if (!map.has(f.name)) map.set(f.name, f);
      }
      all = Array.from(map.values()).sort((a, b) => a.days - b.days);
      this._c.festival.set(key, all);
    }
    return all.filter(x => x.days <= maxDays || x.ongoing);
  },

  _findHolidaysFromLegal(today) {
    const list = [];
    const seen = new Set();
    const startYear = today.getYear();
    let cursor = LegalHoliday.fromYmd(startYear, 1, 1);
    if (!cursor) cursor = LegalHoliday.fromYmd(startYear - 1, 1, 1);
    if (!cursor) return [];

    const MAX_ITER = 800;
    let iter = 0;
    while (cursor && iter < MAX_ITER) {
      iter++;
      const name = cursor.getName();
      const day = cursor.getDay();
      const isWork = cursor.isWork();
      if (!seen.has(name) && !isWork) {
        let restCount = 1, firstDay = day, lastDay = day;
        let back = cursor.next(-1), backIter = 0;
        while (back && back.getName() === name && !back.isWork() && backIter < 60) {
          firstDay = back.getDay(); restCount++; back = back.next(-1); backIter++;
        }
        let forward = cursor.next(1), forwardIter = 0;
        while (forward && forward.getName() === name && !forward.isWork() && forwardIter < 60) {
          lastDay = forward.getDay(); restCount++; forward = forward.next(1); forwardIter++;
        }
        const daysToStart = firstDay.subtract(today);
        const daysToEnd = lastDay.subtract(today);
        if (daysToStart >= 0 || daysToEnd >= 0) {
          const meta = getFestivalMeta(name);
          list.push({
            name, icon: meta.emoji, tone: meta.tone, category: 'legal',
            days: Math.max(0, daysToStart), rest: restCount,
            date: firstDay,
            dateStr: `${firstDay.getMonth()}月${firstDay.getDay()}日`,
            ongoing: daysToStart < 0 && daysToEnd >= 0,
          });
          seen.add(name);
        }
      }
      cursor = cursor.next(1);
    }
    return list;
  },

  _findAllFestivals(today, maxDays = 400) {
    const list = [];
    const seen = new Set();
    for (let i = 0; i <= maxDays; i++) {
      const d = today.next(i);
      const lunar = safe(() => d.getLunarDay(), null);
      const dateStr = `${d.getMonth()}月${d.getDay()}日`;
      if (lunar) {
        const isLeap = safe(() => lunar.getLunarMonth().isLeap(), false);
        if (!isLeap) {
          const lf = safe(() => lunar.getFestival(), null);
          if (lf) {
            const name = nameOf(lf);
            if (name && name !== '—' && !seen.has(name)) {
              seen.add(name);
              const meta = getFestivalMeta(name);
              list.push({ name, icon: meta.emoji, tone: meta.tone, category: 'lunar',
                days: i, rest: 0, date: d, dateStr, ongoing: false });
            }
          }
        }
      }
      const sf = safe(() => d.getFestival(), null);
      if (sf) {
        const name = nameOf(sf);
        if (name && name !== '—' && !seen.has(name)) {
          seen.add(name);
          const meta = getFestivalMeta(name);
          list.push({ name, icon: meta.emoji, tone: meta.tone, category: 'solar',
            days: i, rest: 0, date: d, dateStr, ongoing: false });
        }
      }
      const t = safe(() => d.getTerm(), null);
      if (t) {
        const tn = nameOf(t);
        const td = safe(() => t.getSolarDay(), null);
        if (td && isSameDay(td, d) && (tn === '清明' || tn === '冬至')) {
          const festName = tn + '节';
          if (!seen.has(festName)) {
            seen.add(festName);
            const meta = getFestivalMeta(festName);
            list.push({ name: festName, icon: meta.emoji, tone: meta.tone, category: 'lunar',
              days: i, rest: 0, date: d, dateStr, ongoing: false });
          }
        }
      }
    }
    return list;
  },

  buildPhase(solar, lunar) {
    const key = this._dayKey(solar);
    let v = this._c.phase.get(key);
    if (v) return v;

    const phase = safe(() => solar.getPhase(), null);
    const phaseDay = safe(() => solar.getPhaseDay(), null);

    const name = phase ? nameOf(phase) : '—';
    const emoji = PHASE_EMOJI[name] || '🌙';

    const phaseIdx = phase ? safe(() => phase.getIndex(), 0) : 0;
    const dayIdx = phaseDay ? safe(() => phaseDay.getDayIndex(), 0) : 0;

    let totalDays = 1;
    if (phase) {
      const startDate = safe(() => phase.getSolarDay(), null);
      const nextPhase = safe(() => phase.next(1), null);
      const nextStart = nextPhase ? safe(() => nextPhase.getSolarDay(), null) : null;
      if (startDate && nextStart) {
        totalDays = Math.max(1, nextStart.subtract(startDate));
      }
    }

    const inPhase = totalDays > 1
      ? Math.min(1, Math.max(0, dayIdx / totalDays))
      : 0;

    const ICON_HALF_PCT = 4.5;

    const baseWidth  = phaseIdx * MOON_NODE_STEP;
    const extraWidth = phaseIdx < MOON_SEGMENTS
      ? Math.min(inPhase * MOON_NODE_STEP, MOON_NODE_STEP - ICON_HALF_PCT)
      : 0;
    const fillWidth  = Math.max(0, Math.min(baseWidth + extraWidth, MOON_SEGMENTS * MOON_NODE_STEP));

    const trackPos = Math.max(0, Math.min(MOON_SEGMENTS, phaseIdx + inPhase));
    const progress = (trackPos / MOON_SEGMENTS) * 100;

    const DAYS_PER_PHASE = 29.53 / 8;
    const moonAge = phaseIdx * DAYS_PER_PHASE + dayIdx + 0.5;

    v = {
      name, emoji, phaseIdx, dayIdx,
      dayNum: dayIdx + 1, totalDays,
      moonAge: Math.round(moonAge * 10) / 10,
      progress,
      fillWidth,
    };
    this._c.phase.set(key, v);
    return v;
  },

  buildAlmanac(solar, hour, minute) {
    const key = `${this._dayKey(solar)}-${hour}`;
    let v = this._c.almanac.get(key);
    if (v) return v;

    const { lunar } = this.getLunarAndCycle(solar);
    const solarTime = SolarTime.fromYmdHms(solar.getYear(), solar.getMonth(), solar.getDay(), hour, minute, 0);
    const scDay = solar.getSixtyCycleDay();
    const daySC = safe(() => scDay.getSixtyCycle(), null);
    const dayPillar = nameOf(daySC, '');
    const stem = dayPillar[0] || '';
    const branch = dayPillar[1] || '';

    const recommends = safe(() => scDay.getRecommends(), []) || [];
    const avoids     = safe(() => scDay.getAvoids(), []) || [];
    const sound = safe(() => nameOf(daySC.getSound()), '');

    const clash = BRANCH_OPPOSITE[branch] ? `冲${BRANCH_OPPOSITE[branch]}` : '';
    const sha   = BRANCH_SHA[branch] ? `煞${BRANCH_SHA[branch]}` : '';

    const twelveStar = safe(() => lunar.getTwelveStar(), null);
    const twelveStarName = twelveStar ? nameOf(twelveStar) : '—';
    const isYellow = YELLOW_STARS.has(twelveStarName);
    const eclipticLabel = isYellow ? '黄道' : '黑道';
    const twelveStarValue = `${twelveStarName}（${isYellow ? '吉' : '凶'}）`;

    const duty = safe(() => nameOf(lunar.getDuty()), '');
    const dutyLabel = duty ? `${duty}日` : '';

    const luckyZodiac = getLuckyZodiac(branch);

    const stemElem = STEM_ELEMENT[stem] || '';
    const branchElem = BRANCH_ELEMENT[branch] || '';
    const elementText = `${stem}${stemElem}${branch}${branchElem}`;

    const fetus = safe(() => nameOf(lunar.getFetusDay()), '');
    const star28Raw = safe(() => nameOf(lunar.getTwentyEightStar()), '');

    const star28 = safe(() => lunar.getTwentyEightStar(), null);
    const star28Zone = star28 ? safe(() => nameOf(star28.getZone()), '') : '';
    const star28Elem = star28 ? safe(() => {
      const e = star28.getElement();
      return e ? (nameOf(e) || e) : '';
    }, '') : '';
    const star28Animal = star28 ? safe(() => nameOf(star28.getAnimal()), '') : '';
    const star28Full = [
      star28Zone,
      `${star28Raw}${star28Elem}${star28Animal}`,
    ].filter(Boolean).join(' ');

    const wealthGod  = WEALTH_GOD[stem]  || '';
    const joyGod     = JOY_GOD[stem]     || '';
    const fortuneGod = FORTUNE_GOD[stem] || '';
    const nobleGod   = NOBLE_GOD[stem]   || '';

    const pengzuStem   = PENGZU_STEM[stem]   || '';
    const pengzuBranch = PENGZU_BRANCH[branch] || '';

    const hours = safe(() => lunar.getHours(), []) || [];
    const isSelToday = isSameDay(solar, getTodaySolar());
    const nowIdx = getNowIdx();
    const hourList = hours.slice(0, 12).map((h, i) => {
      const gz = safe(() => nameOf(h.getSixtyCycle()), '');
      const hStem = gz[0] || '';
      const hBranch = gz[1] || '';
      const ts = safe(() => h.getTwelveStar(), null);
      const ecl = ts ? nameOf(safe(() => ts.getEcliptic(), '')) : '';
      const isGood = ecl === '黄道';
      const clashBranch = BRANCH_OPPOSITE[hBranch] || '';
      const clashZodiac = BRANCH_ZODIAC[clashBranch] || '';
      const clashDir    = BRANCH_SHA[hBranch] || '';
      const branchElem  = BRANCH_ELEMENT[hBranch] || '';
      return {
        idx: i,
        gz, stem: hStem, branch: hBranch,
        isGood,
        luck: ecl ? (isGood ? '吉' : '凶') : '',
        isNow: isSelToday && i === nowIdx,
        timeRange: HOUR_RANGES[hBranch] || '',
        clashZodiac,
        clashDir,
        organ: ORGAN_BY_ELEMENT[branchElem] || '',
        wealth:  WEALTH_GOD[hStem]  || '',
        joy:     JOY_GOD[hStem]     || '',
        fortune: FORTUNE_GOD[hStem] || '',
        noble:   NOBLE_GOD[hStem]   || '',
      };
    });

    v = {
      yearSC: nameOf(safe(() => scDay.getYear(), null)),
      monthSC: nameOf(safe(() => scDay.getMonth(), null)),
      dayPillar,
      recommends, avoids,
      sound, clash, sha,
      dutyGod: twelveStarName,
      hourList,
      duty, dutyLabel,
      godsTxt: '',
      fetus,
      star28: star28Raw,
      star28Full,
      pengzuStem, pengzuBranch,
      eclipticLabel,
      twelveStarValue,
      luckyZodiac,
      elementText,
      wealthGod, joyGod, fortuneGod, nobleGod,
    };
    this._c.almanac.set(key, v);
    return v;
  },
};

/* ============================================================
 * 模块 4 · 视图渲染层
   ============================================================ */
const View = {

  render(state) {
    const { year, month, day } = state;
    const solar = SolarDay.fromYmd(year, month, day);
    const { lunar } = Model.getLunarAndCycle(solar);

    return `
      <div class="page">
        <div class="col-left">
          ${this.renderHero(solar, lunar)}
          ${this.renderTerm(solar)}
          ${this.renderMoon(solar, lunar)}
          ${this.renderFestivals(solar, state)}
        </div>
        <div class="col-right">
          ${this.renderCalendar(state)}
          ${this.renderAlmanac(state)}
          ${this.renderHourCard(state)}
        </div>
      </div>
    `;
  },

  renderHero(solar, lunar) {
    const timeStr = formatHHMM(new Date());

    const yearNum = solar.getYear();
    const monthNum = solar.getMonth();
    const dayNum = solar.getDay();
    const weekCn = getWeekCn(solar);
    const semesterText = getSemesterText(new Date(yearNum, monthNum - 1, dayNum));

    const lunarYear = safe(() => lunar.getLunarMonth().getLunarYear().getYear(), yearNum);
    const lm = safe(() => lunar.getLunarMonth().getMonth(), 0);
    const ld = safe(() => lunar.getDay(), 0);
    const lmCn = LUNAR_MONTH_CN[lm] || '';
    const ldCn = LUNAR_DAY_CN[ld] || '';
    const lunarYearCn = yearToChinese(lunarYear);

    const scDay = solar.getSixtyCycleDay();
    const yearSC = nameOf(safe(() => scDay.getYear(), null), '');
    const zodiacCn = safe(() => {
      const eb = SixtyCycle.fromName(yearSC).getEarthBranch();
      return nameOf(eb.getZodiac());
    }, '');
    const yearSCWithZodiac = zodiacCn ? `${yearSC}${zodiacCn}` : yearSC;

    const monthSC = nameOf(safe(() => scDay.getMonth(), null), '');
    const daySC   = nameOf(safe(() => scDay.getSixtyCycle(), null), '');

    const yp = Model.buildYearProgress(solar);
    const percentAlignClass =
      yp.percentAlign === 'left' ? 'edge-left' :
      yp.percentAlign === 'right' ? 'edge-right' : '';

    return `
      <div class="card hero-card">
        <div class="hero-time" id="heroTime">${timeStr}</div>
        <div class="hero-date-line">公元${yearNum}年${monthNum}月${dayNum}日 星期${weekCn} ${semesterText}</div>
        <div class="hero-lunar-line">农历${lunarYearCn}年${lmCn}${ldCn} ${yearSCWithZodiac}年·${monthSC}月·${daySC}日</div>

        <div class="year-progress">
          <div class="year-progress-head">
            <span class="yp-label">
              <span class="yp-dot"></span>
              <span class="yp-days">
                <span class="cur">${yp.dayNum}</span><span class="sep"> / </span><span class="total">${yp.totalDays}</span><span class="unit"> 天</span>
              </span>
            </span>
            <span class="yp-left">剩余 ${yp.daysLeft} 天</span>
          </div>

          <div class="year-progress-bar-wrap">
            <div class="year-progress-percent ${percentAlignClass}" style="left:${yp.progress}%">${yp.percentText}</div>
            <div class="year-progress-bar">
              <div class="year-progress-fill" style="width:${yp.progress}%"></div>
              <span class="year-progress-quarter q1"></span>
              <span class="year-progress-quarter q2"></span>
              <span class="year-progress-quarter q3"></span>
            </div>
            <div class="year-progress-marker" style="left:${yp.progress}%"></div>
          </div>

          <div class="year-progress-footer">
            <span>1月</span><span>4月</span><span>7月</span><span>10月</span>
          </div>
        </div>
      </div>
    `;
  },

  renderTerm(solar) {
    const term = Model.buildTermAround(solar);
    if (!term) return '';

    const houHtml = term.houName
      ? `<div class="term-hou">
           <span class="hou-title">候</span>
           <span class="hou-name">${esc(term.houName)}</span>
           <span class="hou-progress">第 <span class="hou-num">${term.houDayNum}</span> / ${term.houTotalDays} 天</span>
         </div>`
      : '';

    return `
      <div class="card term-card">
        <div class="term-head">
          <div class="term-head-title"><div class="bar"></div>节气</div>
          ${term.seasonName ? `<span class="term-season-tag">${esc(term.seasonName)}</span>` : ''}
        </div>

        <div class="term-line">
          <div class="term-name">${esc(term.prevName)}</div>
          <div class="term-date">${esc(term.prevDate)}</div>
        </div>
        <div class="term-bar">
          <div class="term-bar-fill" style="width:${term.progress}%"></div>
          <div class="term-bar-dot" style="left:${term.progress}%"></div>
        </div>
        <div class="term-tip">
          <span>已过 ${term.daysFromPrev} 天</span>
          <span class="hl">还有 ${term.daysToNext} 天</span>
        </div>
        <div class="term-line">
          <div class="term-name next">${esc(term.nextName)}</div>
          <div class="term-date">${esc(term.nextDate)}</div>
        </div>

        ${houHtml}
      </div>
    `;
  },

  renderMoon(solar, lunar) {
    const phase = Model.buildPhase(solar, lunar);

    const nodesHtml = PHASE_LIST.map((p, i) => {
      let cls;
      if (i === phase.phaseIdx) cls = 'active';
      else if (i < phase.phaseIdx) cls = 'past';
      else cls = 'future';

      return `
        <div class="moon-node ${cls}" title="${esc(p.name)}">
          <div class="icon">${p.emoji}</div>
          <div class="label">${p.short}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="card moon-card">
        <div class="section-title"><div class="bar purple"></div>月相</div>

        <div class="moon-wrap">
          <div class="moon-visual"><span class="moon-emoji">${phase.emoji}</span></div>
          <div class="moon-info">
            <div class="moon-name">${esc(phase.name)}</div>
            <div class="moon-idx">
              月龄 <span class="age-num">${phase.moonAge}</span> 天 · 本相已过 ${phase.dayNum} / ${phase.totalDays} 天
            </div>
          </div>
        </div>

        <div class="moon-track">
          <div class="moon-track-fill" style="width:${phase.fillWidth}%"></div>
          ${nodesHtml}
        </div>
      </div>
    `;
  },

  renderFestivals(solar, state) {
    const rangeKey = state.festRange || DEFAULT_RANGE;
    const rangeOpt = RANGE_OPTIONS.find(x => x.key === rangeKey) || RANGE_OPTIONS[1];
    const list = Model.buildFestivals(solar, rangeOpt.days);

    const isExpanded = !!state.festExpanded;
    const visibleList = isExpanded ? list : list.slice(0, COLLAPSED_COUNT);
    const hasMore = list.length > COLLAPSED_COUNT;

    const rangeBar = `
      <div class="fest-range">
        ${RANGE_OPTIONS.map(opt => `
          <button data-fest-range="${opt.key}" class="${opt.key === rangeKey ? 'active' : ''}">
            ${esc(opt.label)}
          </button>
        `).join('')}
      </div>
    `;

    if (!list.length) {
      return `
        <div class="card festival-card">
          <div class="section-title">
            <div class="bar red"></div>节日
            <span class="count">0</span>
          </div>
          ${rangeBar}
          <div class="fest-empty">未来 ${esc(rangeOpt.label)} 内暂无节日</div>
        </div>
      `;
    }

    const rowsHtml = visibleList.map(f => this.renderFestRow(f)).join('');
    const listHtml = isExpanded ? `<div class="fest-scroll">${rowsHtml}</div>` : rowsHtml;

    const toggleHtml = hasMore ? `
      <div class="fest-toggle ${isExpanded ? 'expanded' : ''}" data-fest-toggle="1">
        <span>${isExpanded ? '收起' : `展开全部 · 共 ${list.length} 个`}</span>
        <span class="chev"></span>
      </div>
    ` : '';

    return `
      <div class="card festival-card">
        <div class="section-title">
          <div class="bar red"></div>节日
          <span class="count">${list.length}</span>
        </div>
        ${rangeBar}
        <div class="fest-list">${listHtml}</div>
        ${toggleHtml}
      </div>
    `;
  },

  renderFestRow(f) {
    let daysHtml;
    if (f.ongoing) {
      daysHtml = `<div class="fest-days ongoing">假期中</div>`;
    } else if (f.days === 0) {
      daysHtml = `<div class="fest-days today">今天</div>`;
    } else {
      daysHtml = `<div class="fest-days">${f.days}天</div>`;
    }
    const subParts = [esc(f.dateStr)];
    if (f.rest > 0) subParts.push(`休${f.rest}天`);
    const sub = subParts.join(' · ');
    const catInfo = CATEGORY_LABELS[f.category] || CATEGORY_LABELS.legal;
    return `
      <div class="fest-row">
        <div class="fest-icon ${f.tone}">${f.icon}</div>
        <div class="fest-info">
          <div class="fest-name">
            ${esc(f.name)}
            <span class="fest-tag ${catInfo.cls}">${catInfo.text}</span>
          </div>
          <div class="fest-sub">${sub}</div>
        </div>
        ${daysHtml}
      </div>
    `;
  },

  renderCalendar(state) {
    const { year, month, day } = state;
    const cells = Model.buildGrid(year, month).map(s =>
      Model.buildDay(s, year, month, year, month, day)
    );
    const today = getToday();
    const isViewingToday = today.year === year && today.month === month;
    return `
      <div class="card calendar-card">
        <div class="cal-header">
          <div class="cal-title">
            <span class="year">${year}年</span><span class="month-num">${month}月</span>
          </div>
          <div class="cal-nav">
            ${!isViewingToday ? `<button class="today-btn" data-nav="today">今天</button>` : ''}
            <button class="year-btn" data-nav="year-prev" aria-label="上一年" title="上一年">«</button>
            <button data-nav="-1" aria-label="上个月" title="上个月">‹</button>
            <button data-nav="1" aria-label="下个月" title="下个月">›</button>
            <button class="year-btn" data-nav="year-next" aria-label="下一年" title="下一年">»</button>
          </div>
        </div>
        <div class="cal-dow-row">
          ${WEEK_LABELS.map(w => `<div class="cal-dow ${w.isWeekend ? 'weekend' : ''}">${esc(w.name)}</div>`).join('')}
        </div>
        <div class="cal-grid">${cells.map(c => this.renderCell(c)).join('')}</div>
      </div>
    `;
  },

  renderCell(cell) {
    const classes = ['cal-cell'];
    if (!cell.isCurrentMonth) classes.push('other-month');
    if (cell.isWeekend && cell.isCurrentMonth) classes.push('weekend');
    if (cell.isSelected) classes.push('selected');
    if (cell.isToday) classes.push('today');

    let badge = '';
    if (cell.holiday) badge = cell.holiday.isWork ? `<span class="badge work">班</span>` : `<span class="badge">休</span>`;
    const moonDot = cell.isMoonDay ? `<span class="moon-dot moon-${cell.moonIndex}"></span>` : '';
    const labelCls = cell.labelType === 'term' ? 'term' : cell.labelType === 'festival' ? 'festival' : '';
    const s = cell.solar;
    return `
      <div class="${classes.join(' ')}" data-y="${s.getYear()}" data-m="${s.getMonth()}" data-d="${s.getDay()}">
        ${badge}
        <div class="day-num">${cell.dayNum}</div>
        <div class="day-label ${labelCls}">${esc(cell.label)}</div>
        ${moonDot}
      </div>
    `;
  },

  renderAlmanac(state) {
    const { year, month, day, hour, minute } = state;
    const solar = SolarDay.fromYmd(year, month, day);
    const al = Model.buildAlmanac(solar, hour, minute);

    const renderYiji = (arr) => arr.length
      ? arr.map(x => `<span class="tag">${esc(nameOf(x))}</span>`).join('')
      : '<span style="color:var(--text-light)">无</span>';

    const nowIdx = getNowIdx();
    const isSelToday = isSameDay(solar, getTodaySolar());
    const selectedIdx = (state.selectedHour != null)
      ? state.selectedHour
      : (isSelToday ? nowIdx : 0);

    const hourStrip = al.hourList.map(h => `
      <div class="hour-chip ${h.isNow ? 'now' : ''} ${h.idx === selectedIdx ? 'selected' : ''}"
           data-hour-idx="${h.idx}">
        <div class="hz">${esc(h.branch)}</div>
        <div class="gz">${esc(h.stem)}</div>
        <div class="jl ${h.isGood ? 'y' : 'n'}">${esc(h.luck)}</div>
      </div>
    `).join('');

    const pengzuLines = [
      al.pengzuStem   ? `<div>${esc(al.pengzuStem)}</div>`   : '',
      al.pengzuBranch ? `<div>${esc(al.pengzuBranch)}</div>` : '',
    ].join('');

    return `
      <div class="card almanac-card">
        <div class="yiji-list">
          <div class="yiji-row"><div class="yiji-icon y">宜</div><div class="yiji-body">${renderYiji(al.recommends)}</div></div>
          <div class="yiji-row"><div class="yiji-icon j">忌</div><div class="yiji-body">${renderYiji(al.avoids)}</div></div>
        </div>

        <div class="day-grid">
          <div class="day-cell">
            <div class="day-key">${esc(al.eclipticLabel)}</div>
            <div class="day-val">${esc(al.twelveStarValue)}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">十二神</div>
            <div class="day-val">${esc(al.dutyLabel || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">幸运生肖</div>
            <div class="day-val">${esc(al.luckyZodiac || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">冲煞</div>
            <div class="day-val red">${esc(al.clash)} ${esc(al.sha)}</div>
          </div>

          <div class="day-cell">
            <div class="day-key">胎神</div>
            <div class="day-val">${esc(al.fetus)}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">喜神</div>
            <div class="day-val">${esc(al.joyGod || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">财神</div>
            <div class="day-val">${esc(al.wealthGod || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">五行</div>
            <div class="day-val">${esc(al.elementText)} <span class="dim">${esc(al.sound)}</span></div>
          </div>

          <div class="day-cell pengzu-cell">
            <div class="day-key">彭祖百忌</div>
            <div class="day-val pengzu-val">${pengzuLines}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">福神</div>
            <div class="day-val">${esc(al.fortuneGod || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">贵神</div>
            <div class="day-val">${esc(al.nobleGod || '—')}</div>
          </div>
          <div class="day-cell">
            <div class="day-key">廿八宿</div>
            <div class="day-val">${esc(al.star28Full || al.star28 || '—')}</div>
          </div>
        </div>

        <div class="hour-strip">
          ${hourStrip}
        </div>
      </div>
    `;
  },

  renderHourCard(state) {
    const { year, month, day, hour, minute } = state;
    const solar = SolarDay.fromYmd(year, month, day);
    const al = Model.buildAlmanac(solar, hour, minute);
    if (!al.hourList.length) return '';

    const nowIdx = getNowIdx();
    const isSelToday = isSameDay(solar, getTodaySolar());
    const selectedIdx = (state.selectedHour != null)
      ? state.selectedHour
      : (isSelToday ? nowIdx : 0);
    const h = al.hourList[selectedIdx] || al.hourList[0];
    if (!h) return '';

    const luckCls = h.isGood ? 'luck-j' : 'luck-x';

    return `
      <div class="card hour-card">
        <div class="hour-card-head">
          <div class="hour-card-title">
            <span>${esc(h.gz)}时</span>
            <span class="hour-card-title-split"> · </span>
            <span class="${luckCls}">${esc(h.luck || '—')}</span>
          </div>
          <div class="hour-card-time">${esc(h.timeRange)}</div>
        </div>

        <div class="hour-detail-grid">
          <div class="hour-detail-cell">
            <div class="hour-detail-key">时辰宜忌</div>
            <div class="hour-detail-val">${esc(h.luck || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">时辰相冲</div>
            <div class="hour-detail-val">${esc(h.clashZodiac || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">方位相冲</div>
            <div class="hour-detail-val">${esc(h.clashDir || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">养生器官</div>
            <div class="hour-detail-val">${esc(h.organ || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">财神</div>
            <div class="hour-detail-val">${esc(h.wealth || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">喜神</div>
            <div class="hour-detail-val">${esc(h.joy || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">福神</div>
            <div class="hour-detail-val">${esc(h.fortune || '—')}</div>
          </div>
          <div class="hour-detail-cell">
            <div class="hour-detail-key">阳贵</div>
            <div class="hour-detail-val">${esc(h.noble || '—')}</div>
          </div>
        </div>
      </div>
    `;
  },
};

/* ============================================================
 * 模块 5 · 应用层
   ============================================================ */
const App = {

  state: (() => {
    const t = getToday();
    return {
      year: t.year, month: t.month, day: t.day,
      hour: t.hour, minute: t.minute,
      festRange: DEFAULT_RANGE,
      festExpanded: false,
      selectedHour: null,
    };
  })(),

  root: null,
  _clockTimer: null,
  _heroEl: null,
  _lastDayKey: '',

  init() {
    this.root = document.getElementById('app');
    this._lastDayKey = new Date().toDateString();
    this.render();
    this.bindEvents();
    this._startClock();
  },

  render() {
    this.root.innerHTML = View.render(this.state);
    this._heroEl = null;
  },

  _renderFestivalsOnly() {
    const old = this.root.querySelector('.festival-card');
    if (!old) return;
    const solar = SolarDay.fromYmd(this.state.year, this.state.month, this.state.day);
    old.outerHTML = View.renderFestivals(solar, this.state);
  },

  navigate(delta) {
    if (delta === 'today') {
      const t = getToday();
      Object.assign(this.state, {
        year: t.year, month: t.month, day: t.day,
        hour: t.hour, minute: t.minute,
        selectedHour: null,
      });
    } else if (delta === 'year-prev') {
      this.state.year -= 1;
    } else if (delta === 'year-next') {
      this.state.year += 1;
    } else {
      let m = this.state.month + delta;
      let y = this.state.year;
      if (m < 1)  { m = 12; y--; }
      if (m > 12) { m = 1;  y++; }
      this.state.year = y;
      this.state.month = m;
    }

    const maxDay = SolarMonth.fromYm(this.state.year, this.state.month).getDayCount();
    if (this.state.day > maxDay) this.state.day = maxDay;

    this.state.festExpanded = false;
    this.state.selectedHour = null;
    this.render();
  },

  bindEvents() {
    this.root.addEventListener('click', (e) => {
      const navBtn = e.target.closest('[data-nav]');
      if (navBtn) {
        const v = navBtn.dataset.nav;
        if (v === 'today') this.navigate('today');
        else if (v === 'year-prev') this.navigate('year-prev');
        else if (v === 'year-next') this.navigate('year-next');
        else this.navigate(+v);
        return;
      }

      const rangeBtn = e.target.closest('[data-fest-range]');
      if (rangeBtn) {
        this.state.festRange = rangeBtn.dataset.festRange;
        this.state.festExpanded = false;
        this._renderFestivalsOnly();
        return;
      }

      const toggle = e.target.closest('[data-fest-toggle]');
      if (toggle) {
        this.state.festExpanded = !this.state.festExpanded;
        this._renderFestivalsOnly();
        return;
      }

      /* 点击时辰：
         1) 切换 .selected 类（不重建 DOM，避免 12 时辰行滚动位置被重置）
         2) 只重建时辰详情卡 */
      const hourChip = e.target.closest('[data-hour-idx]');
      if (hourChip) {
        const idx = +hourChip.dataset.hourIdx;
        this.state.selectedHour = idx;
        this.root.querySelectorAll('.hour-chip').forEach(chip => {
          chip.classList.toggle('selected', +chip.dataset.hourIdx === idx);
        });
        const oldHour = this.root.querySelector('.hour-card');
        if (oldHour) oldHour.outerHTML = View.renderHourCard(this.state);
        return;
      }

      const cell = e.target.closest('.cal-cell');
      if (cell && cell.dataset.y) {
        this.state.year = +cell.dataset.y;
        this.state.month = +cell.dataset.m;
        this.state.day = +cell.dataset.d;
        this.state.festExpanded = false;
        this.state.selectedHour = null;
        this.render();
      }
    });
  },

  _startClock() {
    const tick = () => {
      const now = new Date();

      if (!this._heroEl || !this._heroEl.isConnected) {
        this._heroEl = this.root.querySelector('#heroTime');
      }
      if (this._heroEl) {
        const next = formatHHMM(now);
        if (this._heroEl.textContent !== next) this._heroEl.textContent = next;
      }

      const dayKey = now.toDateString();
      if (dayKey !== this._lastDayKey) {
        this._lastDayKey = dayKey;
        const t = getToday();
        Object.assign(this.state, {
          year: t.year, month: t.month, day: t.day,
          hour: t.hour, minute: t.minute,
          selectedHour: null,
        });
        this.render();
      }

      const delay = 60_000 - (now.getSeconds() * 1000 + now.getMilliseconds()) + 20;
      this._clockTimer = setTimeout(tick, delay);
    };

    tick();
  },
};

/* ============================================================
 * 模块 6 · 启动
   ============================================================ */
App.init();

(function tightenEmbed() {
  try {
    const fe = window.frameElement;
    if (!fe || !fe.style) return;

    const parentWin = window.parent;
    const csOf = (el) => parentWin.getComputedStyle(el);

    const resetIframe = {
      'display': 'block', 'width': '100%', 'max-width': '100%', 'min-width': '0',
      'margin': '0', 'padding': '0', 'border': '0', 'float': 'none',
      'position': 'static', 'left': 'auto', 'right': 'auto', 'top': 'auto',
      'transform': 'none', 'vertical-align': 'top', 'box-sizing': 'border-box',
    };
    for (const k in resetIframe) fe.style.setProperty(k, resetIframe[k], 'important');

    const CONTENT_PAT = /tab|pane|iframe|content|article|post|entry|markdown|inner|body|main|wrapper/i;

    let el = fe.parentElement;
    let depth = 0;
    while (el && el.tagName !== 'HTML' && depth < 8) {
      const cls = ((typeof el.className === 'string' ? el.className : '') + ' ' + (el.id || '')).trim();
      const cs = csOf(el);
      const isContent = CONTENT_PAT.test(cls);

      if ((parseFloat(cs.marginTop)  || 0) > 0) el.style.setProperty('margin-top',  '0', 'important');
      if ((parseFloat(cs.paddingTop) || 0) > 0) el.style.setProperty('padding-top', '0', 'important');

      if (isContent || (cs.maxWidth && cs.maxWidth !== 'none')) {
        if (cs.maxWidth && cs.maxWidth !== 'none') el.style.setProperty('max-width', 'none', 'important');
        if (cs.textAlign === 'center') el.style.setProperty('text-align', 'left', 'important');

        const pl = parseFloat(cs.paddingLeft)  || 0;
        const pr = parseFloat(cs.paddingRight) || 0;
        if (pl > 0 && pl < 500) el.style.setProperty('padding-left',  '0', 'important');
        if (pr > 0 && pr < 500) el.style.setProperty('padding-right', '0', 'important');

        const ml = cs.marginLeft,  mr = cs.marginRight;
        if (ml === 'auto' || (parseFloat(ml) || 0) > 0) el.style.setProperty('margin-left',  '0', 'important');
        if (mr === 'auto' || (parseFloat(mr) || 0) > 0) el.style.setProperty('margin-right', '0', 'important');
      }

      el = el.parentElement;
      depth++;
    }

    try { parentWin.scrollTo({ top: parentWin.scrollY, behavior: 'auto' }); } catch (_) {}
  } catch (e) {}
})();
